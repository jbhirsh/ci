# Claude Review: the AI code review every app runs on its pull requests,
# as its required "Claude Review" check. The app's workflow
# (.github/workflows/claude-review.yml) is a stub: its trigger, its job (whose
# `name:` is the required check), the job's permissions, and one step calling
# this action at @main with its Claude credentials (the federation IDs, or
# an API key, and the subscription token a stopped pass is retried on).
# Everything else is here, so a
# change to the review reaches all three apps at once.
#
# Claude runs on the Claude Agent SDK, on the runner (sdk.mjs), which the
# Max plan's API credit pays for (jbhirsh/ci#68). The reviewer has no
# shell: it reads through its own tools and posts through code holding the
# job's token, as github-actions[bot], each inline comment marked for
# autofix (sdk.mjs and guard.mjs say how it's locked down).
#
# A pass the API refuses for credit or a spend or usage limit is tried once
# more on the owner's Claude subscription, when the stub passes its token
# (`claude_code_oauth_token`, #57). A pass still stopped after that, or with
# no token, fails the check for every PR, since a green check would let a
# self-merging PR (a Dependabot bump, a bot's branch, auto-merge) in
# unreviewed; one PR comment says which limit and when to re-run
# (stopped.mjs), and goes once a review runs without stopping. Two passes
# and two retries on a big PR, with the limits hit late, can come near the
# apps' 45-minute job timeout: accepted.
#
# Every Claude pass runs on the newest Sonnet (`model: "sonnet"`, the alias
# for the newest Sonnet), rather than a default model, which can change to
# another tier. Its thinking is adaptive (the model decides how much), at
# that model's default effort; no effort is set. `review.advisor` lets it
# consult a stronger model on a hard call.
#
# A PR every commit of which is a bot's in `review.skipBots` isn't
# reviewed (skip.mjs): the step passes, saying so.
#
# What it does:
#   1. Renders the prompt (render.mjs): prompt.md, the shared review, plus
#      the app's own guide (`review.instructions` in `.github/ci.json`,
#      settings.mjs), both read from the PR's base branch.
#   2. Runs the review. It leaves an inline comment per
#      merge blocker and one summary comment saying what it read.
#   3. Checks the review read every changed file's diff (coverage.mjs, from
#      the review's own tool calls), lockfiles, images, fonts and the app's
#      `review.skip` globs aside. A file the PR deletes needs only a listing
#      of the diff showing it deleted (`--name-status` or `--summary`, even
#      inside an `&&` chain, or a lone `--stat`/`--numstat` showing its
#      whole path; coverage.mjs). A
#      file it never read goes back to a second pass (followup.md); a file
#      still unread after that fails the check. It was added after a review
#      passed sift #188 twice having seen its tests only in `--stat`.
#   4. Carries files over between pushes (carry.mjs): a file an earlier
#      review of the PR read, whose part of the diff has the same patch-id
#      now, needn't be read again; the prompt lists it as already reviewed.
#      The record lives in an Actions cache per PR, saved only by a run
#      that read everything it had to. To force a full review, add the
#      label `claude-review:full` to the PR (it applies from the next push).
#
# A pass that runs past its turn cap but finishes is not a failure
# (result.mjs); coverage decides.
#
# The prompts ask only for what no automated check of the apps decides:
# each app's CI already runs lint, Prettier, the type-check and type
# coverage, dependency-cruiser, tests with a coverage gate, mutation
# testing, the commit-message check, secret scanning, Semgrep, npm audit, PR
# visuals and its end-to-end and visual tests, and the review is told to
# leave all of that alone. Don't add an instruction a check already covers.
#
# How the layout keeps a PR from steering its own review:
#   - A PR can't change what its own review runs or reads: this action comes
#     from jbhirsh/ci@main, the app's settings and guide are read from the
#     base branch (config.mjs), and CLAUDE.md and .claude/ are the base's
#     before Claude starts (restore.mjs).
#   - No new route to the secrets. A pull_request run executes the PR's
#     copy of the stub, so a same-repo PR could add a step that prints a
#     secret, exactly as it could with the whole review in the app's file
#     before; only people with write access can push such a branch. Fork
#     PRs get no secrets, and Dependabot's get only Dependabot secrets.
#     The token goes into this action as an input and from here only to
#     sdk.mjs's own code (the posting tools), never to the reviewer's
#     process.
name: Claude Review
description: >-
  Reviews a pull request with Claude (the Claude Agent SDK), checks it read
  every changed file's diff (a second pass for any it missed, failing if
  still unread), and leaves inline comments for merge blockers and one
  summary comment. On a later push, a file whose part of the diff is
  unchanged since a review read it is carried over rather than read again.

inputs:
  anthropic_api_key:
    description: >-
      Anthropic API key. Give this or the federation inputs below.
    required: false
    default: ""
  claude_code_oauth_token:
    description: >-
      Subscription fallback only: the federation inputs or an API key sign
      in first. The owner's Claude subscription token (the app's
      CLAUDE_CODE_OAUTH_TOKEN secret, made by `claude setup-token`, set for
      Actions and for Dependabot): a pass the API refuses for credit or a
      spend or usage limit runs once more on it (sdk.mjs). Without it, no
      retry.
    required: false
    default: ""
  anthropic_federation_rule_id:
    description: >-
      Workload identity federation rule (fdrl_...), instead of a stored
      token: with the organization and service account IDs below, the
      Agent SDK trades the job's GitHub OIDC token for a short-lived Claude
      API token each run, so there is no secret to
      expire or be revoked. Billed as API usage,
      not to a Claude subscription. The rule is made in the Anthropic
      Console (Workload identity), and one rule can serve several
      repositories. The IDs aren't secret, so an app writes them in its
      workflow. Pass these instead of anthropic_api_key, not beside it: a
      stored credential is likely tried first.
    required: false
    default: ""
  anthropic_organization_id:
    description: >-
      Anthropic organization UUID, with anthropic_federation_rule_id.
    required: false
    default: ""
  anthropic_service_account_id:
    description: >-
      Service account (svac_...) the federated token acts as, with
      anthropic_federation_rule_id.
    required: false
    default: ""
  anthropic_workspace_id:
    description: >-
      Workspace (wrkspc_...) for federation; needed when the rule spans more
      than one workspace.
    required: false
    default: ""
  github_token:
    description: >-
      Token for reading the PR and posting the review's comments (the
      reviewer's own tools, which post as github-actions[bot]). The job
      needs pull-requests and issues write, and id-token write for a
      federated Claude API token.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        # The diff against the base, and the base's settings (config.mjs).
        fetch-depth: 0

    - uses: actions/setup-node@v7
      with:
        node-version: 24

    # The advisor and the bots whose own PRs aren't reviewed (settings.mjs),
    # from the base branch.
    - name: Read the review settings
      id: settings
      shell: bash
      env:
        CONFIG_REF: origin/${{ github.event.pull_request.base.ref }}
      run: node "$GITHUB_ACTION_PATH/settings.mjs"

    # A PR every commit of which is a listed bot's (`review.skipBots`): a
    # Dependabot bump nobody has fixed. It auto-merges on CI alone; once
    # autofix pushes to it, it's reviewed (skip.mjs).
    - name: Skip a bot's own PR
      id: skip
      if: steps.settings.outputs.skip_bots != ''
      shell: bash
      env:
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github_token }}
        BOTS: ${{ steps.settings.outputs.skip_bots }}
      run: node "$GITHUB_ACTION_PATH/skip.mjs"

    - name: Note a bot's PR not reviewed
      if: steps.skip.outputs.skip == 'true'
      shell: bash
      run: |
        msg="Not reviewed: every commit on this PR is by a bot in review.skipBots (.github/ci.json). It's reviewed once anyone else, autofix included, pushes to it."
        echo "$msg"
        echo "$msg" >> "$GITHUB_STEP_SUMMARY"

    # The newest record of what this PR's reviews read (carry.mjs). Not
    # restored for a PR labelled claude-review:full: everything is read.
    - name: Restore what earlier reviews read
      if: ${{ steps.skip.outputs.skip != 'true' && !contains(github.event.pull_request.labels.*.name, 'claude-review:full') }}
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/claude-review/record.json
        key: claude-review-pr${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: claude-review-pr${{ github.event.pull_request.number }}-

    # Carry-over only saves work: if planning fails, nothing is carried and
    # every file is read (no plan file, an empty `carried`), and no record
    # is saved.
    - name: Plan which files to read
      id: plan
      if: steps.skip.outputs.skip != 'true'
      continue-on-error: true
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        CONFIG_REF: origin/${{ github.event.pull_request.base.ref }}
        RECORD: ${{ runner.temp }}/claude-review/record.json
        PLAN: ${{ runner.temp }}/claude-review/plan.json
      run: node "$GITHUB_ACTION_PATH/carry.mjs" plan

    - name: Render the review prompt
      id: render
      if: steps.skip.outputs.skip != 'true'
      shell: bash
      env:
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        CONFIG_REF: origin/${{ github.event.pull_request.base.ref }}
        PLAN: ${{ runner.temp }}/claude-review/plan.json
      run: node "$GITHUB_ACTION_PATH/render.mjs" review

    # What the reviewer loads is the base's (restore.mjs), and the
    # checkout's git credentials go: the reviewer can't read the token
    # files under $RUNNER_TEMP (guard.mjs), and this leaves none in .git.
    - name: Restore Claude's files from the base
      if: steps.skip.outputs.skip != 'true'
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        node "$GITHUB_ACTION_PATH/restore.mjs"
        { git config --local --name-only --get-regexp '^(includeif\.|http\.https://github\.com/\.extraheader)' || true; } \
          | sort -u | while IFS= read -r key; do git config --local --unset-all "$key"; done

    # The Agent SDK and its peers, from this repo's lockfile into the
    # action's own checkout: nothing in the app's workspace changes.
    - name: Install the Agent SDK
      if: steps.skip.outputs.skip != 'true'
      shell: bash
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH/.."

    # The review (sdk.mjs says how it's locked down). continue-on-error: it
    # fails when the pass doesn't finish, for result.mjs to judge. A pass the
    # API refuses for credit or a limit is retried on the subscription; one
    # still stopped ends with a warning (`stopped`), which skips the coverage
    # check, the follow-up and the record, and "Fail a review that stopped"
    # fails the check.
    - name: Review with the Agent SDK
      id: review
      if: steps.skip.outputs.skip != 'true'
      continue-on-error: true
      shell: bash
      env:
        PROMPT: ${{ steps.render.outputs.prompt }}
        MAX_TURNS: "200"
        ADVISOR: ${{ steps.settings.outputs.advisor }}
        CI_DIR: ${{ github.action_path }}/..
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ inputs.github_token }}
        OUT_FILE: ${{ runner.temp }}/claude-review/sdk-pass-1.json
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic_federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic_organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.anthropic_service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic_workspace_id }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
      run: |
        mkdir -p "$RUNNER_TEMP/claude-review"
        node "$GITHUB_ACTION_PATH/sdk.mjs"

    - name: Check the review finished
      if: steps.review.outcome == 'failure' && steps.review.outputs.stopped == ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/result.mjs" "$EXECUTION_FILE"

    - name: Check the review read every changed file
      id: coverage
      if: steps.review.outputs.execution_file != '' && steps.review.outputs.stopped == ''
      shell: bash
      env:
        REPO_DIR: ${{ github.workspace }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        SKIP: ${{ steps.render.outputs.skip }}
        CARRIED: ${{ steps.plan.outputs.carried }}
        # The files the PR deletes (carry.mjs), which a listing covers.
        REMOVED: ${{ steps.plan.outputs.removed }}
        EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
      run: |
        set -o pipefail
        # The name "Fail if files are still unread" reads it by.
        cp "$EXECUTION_FILE" "$RUNNER_TEMP/review-pass-1.json"
        git -c core.quotePath=false diff --name-only -M "origin/$BASE_REF...HEAD" \
          | node "$GITHUB_ACTION_PATH/coverage.mjs" "$RUNNER_TEMP/review-pass-1.json" \
          > "$RUNNER_TEMP/unread.txt"
        if [ -s "$RUNNER_TEMP/unread.txt" ]; then
          echo "The review didn't read:"
          cat "$RUNNER_TEMP/unread.txt"
          {
            echo 'unread<<UNREAD_EOF'
            cat "$RUNNER_TEMP/unread.txt"
            echo 'UNREAD_EOF'
          } >> "$GITHUB_OUTPUT"
        else
          echo "The review read every changed file it had to."
        fi

    - name: Render the follow-up prompt
      id: render-followup
      if: steps.coverage.outputs.unread != ''
      shell: bash
      env:
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        CONFIG_REF: origin/${{ github.event.pull_request.base.ref }}
        UNREAD: ${{ steps.coverage.outputs.unread }}
      run: node "$GITHUB_ACTION_PATH/render.mjs" followup

    - name: Follow up with the Agent SDK
      id: followup
      if: steps.coverage.outputs.unread != ''
      continue-on-error: true
      shell: bash
      env:
        PROMPT: ${{ steps.render-followup.outputs.prompt }}
        MAX_TURNS: ${{ steps.render-followup.outputs.max_turns }}
        ADVISOR: ${{ steps.settings.outputs.advisor }}
        CI_DIR: ${{ github.action_path }}/..
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ inputs.github_token }}
        OUT_FILE: ${{ runner.temp }}/claude-review/sdk-pass-2.json
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic_federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic_organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.anthropic_service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic_workspace_id }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
      run: node "$GITHUB_ACTION_PATH/sdk.mjs"

    - name: Check the follow-up finished
      if: steps.followup.outcome == 'failure' && steps.followup.outputs.stopped == ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.followup.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/result.mjs" "$EXECUTION_FILE"

    - name: Fail if files are still unread
      if: steps.coverage.outputs.unread != '' && steps.followup.outputs.stopped == ''
      shell: bash
      env:
        REPO_DIR: ${{ github.workspace }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        SKIP: ${{ steps.render.outputs.skip }}
        CARRIED: ${{ steps.plan.outputs.carried }}
        # The files the PR deletes (carry.mjs), which a listing covers.
        REMOVED: ${{ steps.plan.outputs.removed }}
        FOLLOWUP_FILE: ${{ steps.followup.outputs.execution_file }}
      run: |
        set -o pipefail
        passes=("$RUNNER_TEMP/review-pass-1.json")
        if [ -n "$FOLLOWUP_FILE" ]; then
          passes+=("$FOLLOWUP_FILE")
        fi
        unread=$(git -c core.quotePath=false diff --name-only -M "origin/$BASE_REF...HEAD" \
          | node "$GITHUB_ACTION_PATH/coverage.mjs" "${passes[@]}")
        if [ -n "$unread" ]; then
          while IFS= read -r file; do
            echo "::error file=$file::Claude Review never read this file's diff, even on a second pass."
          done <<< "$unread"
          exit 1
        fi
        echo "The follow-up read the rest."

    # Reached only when every pass finished and read every file it had to,
    # so the record claims nothing a review didn't read.
    - name: Record what this review read
      if: steps.review.outputs.execution_file != '' && steps.plan.outcome == 'success' && steps.review.outputs.stopped == '' && steps.followup.outputs.stopped == ''
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RECORD: ${{ runner.temp }}/claude-review/record.json
        PLAN: ${{ runner.temp }}/claude-review/plan.json
      run: node "$GITHUB_ACTION_PATH/carry.mjs" save

    - name: Save what this review read
      if: steps.review.outputs.execution_file != '' && steps.plan.outcome == 'success' && steps.review.outputs.stopped == '' && steps.followup.outputs.stopped == ''
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/claude-review/record.json
        key: claude-review-pr${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

    # A pass still stopped after the subscription retry, or with no token to
    # retry on: the PR isn't reviewed, so this fails the check, whoever
    # opened the PR, and keeps one PR comment saying why (stopped.mjs). A
    # first-pass stop skips the coverage check and the follow-up; a
    # follow-up stop fails here even with nothing left unread, as it may
    # have stopped before posting what it found. `!cancelled()`: the pass
    # steps are continue-on-error, but a step before this may have failed.
    - name: Fail a review that stopped
      if: ${{ !cancelled() && (steps.review.outputs.stopped != '' || steps.followup.outputs.stopped != '') }}
      shell: bash
      env:
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github_token }}
        REVIEW_STOPPED: ${{ steps.review.outputs.stopped }}
        REVIEW_FALLBACK: ${{ steps.review.outputs.fallback }}
        REVIEW_TURNS: ${{ steps.review.outputs.turns }}
        REVIEW_FILE: ${{ steps.review.outputs.execution_file }}
        FOLLOWUP_STOPPED: ${{ steps.followup.outputs.stopped }}
        FOLLOWUP_FALLBACK: ${{ steps.followup.outputs.fallback }}
        FOLLOWUP_TURNS: ${{ steps.followup.outputs.turns }}
        FOLLOWUP_FILE: ${{ steps.followup.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/stopped.mjs" report

    # No pass stopped (a retry that cured a stop included): an earlier run's
    # stopped-review comment goes, even if a later step failed for another
    # reason. Best-effort, so it never decides the check.
    - name: Clear the stopped-review comment
      if: ${{ !cancelled() && steps.review.outputs.execution_file != '' && steps.review.outputs.stopped == '' && steps.followup.outputs.stopped == '' }}
      continue-on-error: true
      shell: bash
      env:
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: node "$GITHUB_ACTION_PATH/stopped.mjs" clear
