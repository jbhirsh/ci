name: README screenshots, compare
description: >-
  Compares freshly taken README screenshots with the README's (compare.mjs's
  header says how) and hands the ones that changed to the publishing job as
  the `readme-screenshots` artifact. The last step of the app's capture job,
  which installed the app's dependencies (pixelmatch and pngjs come from
  them) and wrote the fresh shots, named as the README names them, to one
  folder. The capture job holds a read-only token: the job that publishes
  runs no npm.

inputs:
  fresh:
    description: The folder holding the fresh screenshots.
    required: true

outputs:
  changed:
    description: The screenshots that changed, space-separated; empty when none did.
    value: ${{ steps.compare.outputs.changed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Compare the screenshots
      id: compare
      shell: bash
      env:
        FRESH: ${{ inputs.fresh }}
      run: node "$GITHUB_ACTION_PATH/../compare.mjs" "$FRESH" "$RUNNER_TEMP/readme-screenshots"

    - uses: actions/upload-artifact@v7
      if: steps.compare.outputs.changed != ''
      with:
        name: readme-screenshots
        path: ${{ runner.temp }}/readme-screenshots
        retention-days: 7
