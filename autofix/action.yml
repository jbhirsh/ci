# Claude autofix: fixes bots' PRs (Dependabot's) that nobody else will fix.
# The app's workflow (.github/workflows/claude-autofix.yml) is a stub: its
# `workflow_run` trigger, which lists the app's gating workflows by `name:`
# (that list stays in the app, since only YAML can say it, and
# check-triggers/action.yml, a step of the app's CI, keeps it complete), its
# concurrency group, the job's permissions and timeout, and one step calling
# this action at @main with its Claude credentials (the federation IDs, or
# an API key).
#
# On each listed workflow's completion it decides from the PR's state, not
# from which run woke it (the concurrency group keeps one pending run, so a
# later completion can replace the one that saw the event), and does at
# most one of:
#   - CI fixer, on an npm bump's current head once no pull-request
#     workflow run there is still going (gate.ts: a run that finds one
#     exits, and the last to finish wakes the run that acts, since
#     check-triggers.ts holds every pull-request workflow the app doesn't
#     exempt to the stub's list), so its one attempt sees every failure, a
#     slow one's included: has Claude fix
#     mechanical breakage from the bump (ci-fix.md), or comment when the fix
#     is a behaviour decision or not the bump's fault. One attempt per head,
#     two per PR, counted from its marker comments.
#   - Review fixer, once CI (ci.yml) and Claude Review (claude-review.yml)
#     are both green on the head (gate.ts again): has Claude fix each
#     unresolved review thread Claude Review or the owner opened, as fixup
#     commits folded into the commits they fix (review-fix.md), and resolve
#     those threads. One round per head, two per PR.
# A fixer whose Claude step crashed before taking a turn (a timeout setting
# it up) is tried once more in the same job, straight away; one that ran
# and failed isn't, but says so on the PR (crash.ts).
# Before either, on a Dependabot npm bump, it turns auto-merge on, once
# per PR (../dependabot-merge/enable.ts), whatever its labels say: a run
# here puts no check on the PR, where a workflow of its own would.
# Nothing polls or waits: the completions are the clock.
# Each fixer proves its fix before pushing with the app's own commands, the
# steps of its CI that can run here (`autofix` in `.github/ci.json`,
# settings.ts and commands.ts), read from the default branch. A person's
# PR, a fork's PR and a PR labelled `no-auto-fix` are left alone, and so are
# the red checks (not the review threads) of a PR from an app's Dependabot
# group named `blocked-<package>`: a major that waits on another package,
# red until it catches up.
#
# The job runs with a write token and unrestricted git/npm/gh, and acts on
# review text: it checks out same-repo branches only, acts only on threads
# from Claude Review or the owner, and counts only markers that
# github-actions[bot] posted, since anyone can comment on a public PR. The
# workflow_run event runs the stub from the default branch, so a PR can't
# change it.
#
# Claude runs on the Claude Agent SDK (sdk.ts), which the Max plan's API
# credit pays for (jbhirsh/ci#68). Claude pushes and posts itself, with the
# app's BOT_PR_TOKEN (`bot_token`). That token lasts longer than the Claude
# app's token it replaced, and the bump's npm scripts run in this job: a
# risk the owner accepted (#68). Its execution file goes to the crash and
# retry steps.
#
# Every Claude pass runs on the newest Sonnet (`model: "sonnet"`), rather
# than a default model, which can change to another tier. Its thinking is
# adaptive (the model decides how much), at that model's default effort; no
# effort is set. `autofix.advisor` lets it consult a stronger model.
name: Claude autofix
description: >-
  Fixes a bot's PR: mechanical breakage when a dependency bump fails a
  check, and the review threads Claude Review or the owner left once the
  build is green. It also turns auto-merge on for a Dependabot npm bump,
  once (../dependabot-merge/enable.ts).

inputs:
  anthropic_api_key:
    description: >-
      Anthropic API key. Give this or the federation inputs below.
    required: false
    default: ""
  anthropic_federation_rule_id:
    description: >-
      Workload identity federation rule (fdrl_...), instead of a stored
      token: with the organization and service account IDs below, the
      Agent SDK trades the job's GitHub OIDC token for a short-lived Claude
      API token each run, so there is no secret to
      expire or be revoked. Billed as API usage,
      not to a Claude subscription. The rule is made in the Anthropic
      Console (Workload identity), and one rule can serve several
      repositories. The IDs aren't secret, so an app writes them in its
      workflow. Pass these instead of anthropic_api_key, not beside it: a
      stored credential is likely tried first.
    required: false
    default: ""
  anthropic_organization_id:
    description: >-
      Anthropic organization UUID, with anthropic_federation_rule_id.
    required: false
    default: ""
  anthropic_service_account_id:
    description: >-
      Service account (svac_...) the federated token acts as, with
      anthropic_federation_rule_id.
    required: false
    default: ""
  anthropic_workspace_id:
    description: >-
      Workspace (wrkspc_...) for federation; needed when the rule spans more
      than one workspace.
    required: false
    default: ""
  bot_token:
    description: >-
      The app's BOT_PR_TOKEN, a fine-grained token on the app with Contents
      and Pull requests read and write (the push, the fixer's comment,
      resolving threads) and Actions read (the failed runs' logs), which the
      fixer pushes with and runs gh with (sdk.ts). Pushes by it start the
      PR's workflows, as the Claude app's did. No Workflows permission: it
      mustn't push workflow files.
    required: false
    default: ""
  github_token:
    description: >-
      Token for this action's own `gh` calls (finding the PR, its checks and
      threads, posting marker comments). Claude itself pushes with
      bot_token. The job needs contents, pull-requests and issues write,
      actions read, and id-token write for a federated Claude API token.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Resolve PR info
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        # Through env, never ${{ }} in the script: branch names can hold
        # quotes and $, which would be script injection.
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        SHA: ${{ github.event.workflow_run.head_sha }}
        EVENT: ${{ github.event.workflow_run.event }}
      run: |
        echo "skip=true" >> "$GITHUB_OUTPUT"
        if [ "$EVENT" != "pull_request" ]; then
          echo "The run was for a $EVENT event, not a pull request — skipping"
          exit 0
        fi
        # A commit can belong to several PRs, in no set order; take the open
        # one on this run's branch. None (e.g. CI finished after the merge
        # deleted the branch) means nothing is left to fix.
        PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
          | jq -c --arg branch "$HEAD_BRANCH" 'map(select(.state == "open" and .head.ref == $branch))[0]')
        if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
          echo "No open PR on this branch for $SHA — skipping"
          exit 0
        fi
        # Same-repo only: never check out or run code from a fork PR.
        HEAD_REPO=$(echo "$PR_JSON" | jq -r '.head.repo.full_name')
        if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
          echo "PR head is a fork ($HEAD_REPO) — skipping"
          exit 0
        fi
        NUMBER=$(echo "$PR_JSON" | jq -r '.number')
        # Bots' PRs only (Dependabot today). A bot can't answer a review
        # or fix its own build, so autofix does it; a person's PR is
        # theirs to change.
        if [ "$(echo "$PR_JSON" | jq -r '.user.type')" != "Bot" ]; then
          echo "PR #$NUMBER was opened by a person — leaving it to its author"
          exit 0
        fi
        BRANCH=$(echo "$PR_JSON" | jq -r '.head.ref')
        LABELS=$(echo "$PR_JSON" | jq -r '[.labels[].name] | join(",")')
        echo "PR #$NUMBER on branch $BRANCH (labels: $LABELS)"
        echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        if echo "$LABELS" | tr ',' '\n' | grep -qx "no-auto-fix"; then
          echo "Labelled no-auto-fix — skipping"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    # Dependabot's npm bumps merge themselves once the branch rule is
    # satisfied: auto-merge goes on here, the first time a check on the PR
    # completes, rather than in a workflow on the PR, whose job would show
    # as a skipped check on every other PR. Once per PR, and before the
    # no-auto-fix label is read: that label stops fixes, not merging
    # (../dependabot-merge/enable.ts says when it acts). A convenience, so
    # neither step failing (auto-merge off in the repo's settings, an API
    # error) stops the fixers below.
    - uses: actions/setup-node@v7
      if: startsWith(steps.pr.outputs.branch, 'dependabot/npm_and_yarn/')
      continue-on-error: true
      with:
        node-version: 24

    - name: Turn on auto-merge for a Dependabot npm bump
      if: startsWith(steps.pr.outputs.branch, 'dependabot/npm_and_yarn/')
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
      run: node "$GITHUB_ACTION_PATH/../dependabot-merge/enable.ts"

    - uses: actions/checkout@v7
      if: steps.pr.outputs.skip == 'false'
      with:
        ref: ${{ steps.pr.outputs.branch }}
        fetch-depth: 0
        # Don't leave the Actions token in git config: git would push with
        # it instead of the bot token "Set up the Agent SDK" sets, and
        # GitHub holds every workflow on a push by that token
        # ("action_required"), so the fix would never be checked.
        persist-credentials: false

    - uses: actions/setup-node@v7
      if: steps.pr.outputs.skip == 'false'
      with:
        node-version: 24
        cache: npm

    # The advisor (settings.ts), from the default branch. It reads the
    # app's autofix settings on every run, so a bad autofix key in
    # .github/ci.json fails even a run with nothing to fix.
    - name: Read autofix's settings
      id: settings
      if: steps.pr.outputs.skip == 'false'
      shell: bash
      env:
        CONFIG_REF: origin/${{ github.event.repository.default_branch }}
      run: node "$GITHUB_ACTION_PATH/settings.ts"

    # Red checks on a Dependabot PR have no one else to fix them: Dependabot
    # can't fix its own PRs, Claude Review only comments, and the review
    # fixer works only green builds. Its push re-runs CI and Claude Review,
    # and the next run works the threads. (If it pushes nothing it has asked
    # the owner to step in, and the red build blocks the merge anyway.)
    - name: Check for failed checks to fix
      id: ci
      # Every completion, not only a failed one: the last workflow to finish
      # may pass after an earlier one failed, and it's the run that acts.
      if: steps.pr.outputs.skip == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        BRANCH: ${{ steps.pr.outputs.branch }}
        PR: ${{ steps.pr.outputs.number }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        BASE_REF: ${{ github.event.repository.default_branch }}
      run: |
        set -o pipefail
        echo "fix=false" >> "$GITHUB_OUTPUT"
        # npm bumps only: a github-actions bump edits workflow files, which
        # the bot token can't push.
        case "$BRANCH" in
          # An app's Dependabot groups named blocked-<package> hold majors
          # that wait on another package (its dependabot.yml says which,
          # and why): red until that package catches up, then green, and
          # auto-merge takes it. Its red checks are nothing to fix; its
          # review threads, once green, still are.
          dependabot/*/blocked-*)
            echo "A Dependabot blocked-* group — red until another package catches up, leaving its checks"
            exit 0 ;;
          dependabot/npm_and_yarn/*) ;;
          *) echo "Not an npm bump — leaving it"; exit 0 ;;
        esac
        # Only the PR's current head; a newer push gets its own runs.
        CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.head.sha')
        if [ "$CURRENT" != "$RUN_SHA" ]; then
          echo "Run is for $RUN_SHA but the PR head is $CURRENT — skipping"
          exit 0
        fi
        # One attempt per head, counted from the marker comment each attempt
        # posts below, so two completions close together can't both fix
        # (the concurrency group runs them one after the other). Only
        # markers this workflow posted count: anyone can comment.
        OWN=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
        MARKERS=$(echo "$OWN" | { grep -o '<!-- autofix-ci:[0-9a-f]* -->' || true; })
        if echo "$MARKERS" | grep -qF "<!-- autofix-ci:$RUN_SHA -->"; then
          echo "Already attempted on $RUN_SHA — skipping"
          exit 0
        fi
        # Act only once no pull-request run on the head is still going
        # (autofix's own and the app's exempt workflows aside); the last of
        # them to finish wakes the run that gets past here (gate.ts).
        PENDING=$(node "$GITHUB_ACTION_PATH/gate.ts" pending)
        if [ -n "$PENDING" ]; then
          echo "Still running on $RUN_SHA: $PENDING — the last of them to finish starts the fix"
          exit 0
        fi
        # Every failed check on this head, not just this run's, so a
        # workflow whose run got dropped from the queue still counts. Claude
        # Review failing is never a code problem to fix, and neither is PR
        # description: it wants a different description, not a code change.
        FAILED=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_SHA/check-runs" --paginate \
          --jq '.check_runs[] | select((.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure") and .name != "Claude Review" and .name != "PR description") | .name' | sort -u | paste -sd, -)
        if [ -z "$FAILED" ]; then
          echo "No failed checks besides Claude Review and PR description — nothing to fix"
          exit 0
        fi
        # Two attempts per PR, so a fix that keeps failing can't loop.
        ATTEMPTS=$(echo "$MARKERS" | { grep -c . || true; })
        if [ "$ATTEMPTS" -ge 2 ]; then
          if ! echo "$OWN" | grep -qF '<!-- autofix-ci-stopped -->'; then
            BODY=$(printf '<!-- autofix-ci-stopped -->\nChecks are still failing after %s autofix attempts, so autofix has stopped on this PR. It needs a person.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$ATTEMPTS")
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
          exit 0
        fi
        BODY=$(printf '<!-- autofix-ci:%s -->\nAutofix is looking at the failed checks on %s: %s. Attempt %s of 2.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$RUN_SHA" "${RUN_SHA:0:7}" "$FAILED" "$((ATTEMPTS + 1))")
        gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
        {
          echo "failed_checks=$FAILED"
          echo "fix=true"
        } >> "$GITHUB_OUTPUT"

    - name: Count unresolved threads
      # Runs on any listed workflow's completion and decides from the PR's
      # state. Green CI only: on a red build the review fixer would be
      # changing code nobody has checked, and could patch the breakage
      # outside the CI fixer's rules. Claude Review no longer waits for CI,
      # so both must be green on the head; it doesn't fail for its findings.
      # Not when the CI fixer has work in this run: it may leave edits in
      # the checkout, and its push starts new runs that pick the round up.
      id: threads
      if: steps.pr.outputs.skip == 'false' && steps.ci.outputs.fix != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        OWNER: ${{ github.repository_owner }}
        NAME: ${{ github.event.repository.name }}
        RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        PR: ${{ steps.pr.outputs.number }}
      run: |
        set -o pipefail
        echo "count=0" >> "$GITHUB_OUTPUT"
        # Fresh from the API: an earlier run may have pushed.
        CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.head.sha')
        if [ "$CURRENT" != "$RUN_SHA" ]; then
          echo "Run is for $RUN_SHA but the PR head is $CURRENT — skipping"
          exit 0
        fi
        # The latest run of each on this head (gate.ts); whichever listed
        # workflow finishes last, once both are green, gets past here.
        NOT_GREEN=$(node "$GITHUB_ACTION_PATH/gate.ts" green ci.yml claude-review.yml)
        if [ -n "$NOT_GREEN" ]; then
          echo "Not green on $RUN_SHA: $NOT_GREEN — the review fixer waits for CI and Claude Review to both be green"
          exit 0
        fi
        # One round per head: every listed workflow's completion gets here
        # once both are green, so without this two runs could each start a
        # round on one head (and rework threads the first skipped). Only
        # markers this workflow posted count: anyone can comment. The
        # `autofix-review-round:<sha>` form is what sift's own workflow
        # posted before it moved here.
        OWN=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
        if echo "$OWN" | grep -qE "<!-- autofix-review-(head|round):$RUN_SHA -->"; then
          echo "A review-fix round already started on $RUN_SHA — skipping"
          exit 0
        fi
        UNRESOLVED=0
        CURSOR=null
        while : ; do
          PAGE=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!,$after:String){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100,after:$after){pageInfo{hasNextPage endCursor} nodes{isResolved comments(first:1){nodes{body author{__typename login}}}}}}}}' \
            -F owner="$OWNER" \
            -F name="$NAME" \
            -F number="$PR" \
            -F after="$CURSOR")
          # Only threads Claude Review or the owner opened (threads.ts).
          COUNT=$(echo "$PAGE" | node "$GITHUB_ACTION_PATH/threads.ts" "$OWNER")
          UNRESOLVED=$((UNRESOLVED + COUNT))
          HAS_NEXT=$(echo "$PAGE" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')
          if [ "$HAS_NEXT" != "true" ]; then break; fi
          CURSOR=$(echo "$PAGE" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor')
        done
        echo "Unresolved threads: $UNRESOLVED"
        if [ "$UNRESOLVED" -eq 0 ]; then exit 0; fi
        # At most two review-fix rounds per PR. Claude Review also reviews
        # autofix's own pushes, so review -> fix -> review could otherwise
        # cycle forever.
        ROUNDS=$(echo "$OWN" | { grep -c '<!-- autofix-review-round' || true; })
        if [ "$ROUNDS" -ge 2 ]; then
          echo "Two review-fix rounds already ran — leaving these threads to a person"
          exit 0
        fi
        BODY=$(printf '<!-- autofix-review-round -->\n<!-- autofix-review-head:%s -->\nAutofix is addressing %s review thread(s). Round %s of 2.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$RUN_SHA" "$UNRESOLVED" "$((ROUNDS + 1))")
        gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
        echo "count=$UNRESOLVED" >> "$GITHUB_OUTPUT"

    # Either fixer pushes with the bot token (sdk.ts), as git's credential
    # for github.com in this checkout, and commits as github-actions[bot],
    # whose commits the review exempts from its one-design rule. Only when
    # there's a fix to make, so a run with nothing to do installs nothing.
    - name: Set up the Agent SDK
      if: steps.ci.outputs.fix == 'true' || (steps.threads.outputs.count != '' && steps.threads.outputs.count != '0')
      shell: bash
      env:
        BOT_TOKEN: ${{ inputs.bot_token }}
      run: |
        if [ -z "$BOT_TOKEN" ]; then
          echo "::error title=No bot token::The autofix stub passes no bot_token (the app's BOT_PR_TOKEN secret), which the fixer pushes with."
          exit 1
        fi
        auth=$(printf 'x-access-token:%s' "$BOT_TOKEN" | base64 -w0)
        git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
        git config --local user.name 'github-actions[bot]'
        git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH/.."

    - name: Render the CI fixer's prompt
      id: ci-prompt
      if: steps.ci.outputs.fix == 'true'
      shell: bash
      env:
        REPO: ${{ github.repository }}
        PR: ${{ steps.pr.outputs.number }}
        BASE_REF: ${{ github.event.repository.default_branch }}
        BRANCH: ${{ steps.pr.outputs.branch }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        FAILED_CHECKS: ${{ steps.ci.outputs.failed_checks }}
      run: node "$GITHUB_ACTION_PATH/render.ts" ci-fix

    - name: Fix with the Agent SDK (ci-fix)
      id: ci-fix
      if: steps.ci.outputs.fix == 'true'
      continue-on-error: true
      shell: bash
      env:
        PROMPT: ${{ steps.ci-prompt.outputs.prompt }}
        ADVISOR: ${{ steps.settings.outputs.advisor }}
        GH_TOKEN: ${{ inputs.bot_token }}
        OUT_FILE: ${{ runner.temp }}/claude-autofix/ci-fix.json
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic_federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic_organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.anthropic_service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic_workspace_id }}
      run: node "$GITHUB_ACTION_PATH/sdk.ts"

    # The marker went up before Claude started, so a fixer that dies before
    # doing anything (a timeout setting the step up) would spend the head's
    # one attempt with nothing to show and nothing left to wake another run.
    # crash.ts tells that apart from a fixer that ran and failed: only a
    # crash is tried again, once and at once; a run that failed was the
    # attempt. A push before the failure starts new runs on the new head.
    - name: Decide whether to retry the CI fixer
      id: ci-retry
      if: steps.ci-fix.outcome == 'failure'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        EXECUTION_FILE: ${{ steps.ci-fix.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/crash.ts" retry

    - name: Fix with the Agent SDK (ci-fix-again)
      id: ci-fix-again
      if: steps.ci-retry.outputs.retry == 'true'
      continue-on-error: true
      shell: bash
      env:
        PROMPT: ${{ steps.ci-prompt.outputs.prompt }}
        ADVISOR: ${{ steps.settings.outputs.advisor }}
        GH_TOKEN: ${{ inputs.bot_token }}
        OUT_FILE: ${{ runner.temp }}/claude-autofix/ci-fix-again.json
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic_federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic_organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.anthropic_service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic_workspace_id }}
      run: node "$GITHUB_ACTION_PATH/sdk.ts"

    # The last try failed without pushing: say so on the PR, and fail the
    # job, which continue-on-error above would otherwise hide (crash.ts).
    - name: Report the CI fixer's failure
      if: steps.ci-retry.outputs.report == 'true' || steps.ci-fix-again.outcome == 'failure'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EXECUTION_FILE: ${{ steps.ci-fix-again.outputs.execution_file || steps.ci-fix.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/crash.ts" report ci

    - name: Render the review fixer's prompt
      id: review-prompt
      if: steps.threads.outputs.count != '' && steps.threads.outputs.count != '0'
      shell: bash
      env:
        REPO: ${{ github.repository }}
        PR: ${{ steps.pr.outputs.number }}
        BASE_REF: ${{ github.event.repository.default_branch }}
      run: node "$GITHUB_ACTION_PATH/render.ts" review-fix

    - name: Fix with the Agent SDK (review-fix)
      id: review-fix
      if: steps.threads.outputs.count != '' && steps.threads.outputs.count != '0'
      continue-on-error: true
      shell: bash
      env:
        PROMPT: ${{ steps.review-prompt.outputs.prompt }}
        ADVISOR: ${{ steps.settings.outputs.advisor }}
        GH_TOKEN: ${{ inputs.bot_token }}
        OUT_FILE: ${{ runner.temp }}/claude-autofix/review-fix.json
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic_federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic_organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.anthropic_service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic_workspace_id }}
      run: node "$GITHUB_ACTION_PATH/sdk.ts"

    # As for the CI fixer above: a crash is tried once more, at once, a run
    # that failed was the round, and the last failure is said on the PR.
    - name: Decide whether to retry the review fixer
      id: review-retry
      if: steps.review-fix.outcome == 'failure'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        EXECUTION_FILE: ${{ steps.review-fix.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/crash.ts" retry

    - name: Fix with the Agent SDK (review-fix-again)
      id: review-fix-again
      if: steps.review-retry.outputs.retry == 'true'
      continue-on-error: true
      shell: bash
      env:
        PROMPT: ${{ steps.review-prompt.outputs.prompt }}
        ADVISOR: ${{ steps.settings.outputs.advisor }}
        GH_TOKEN: ${{ inputs.bot_token }}
        OUT_FILE: ${{ runner.temp }}/claude-autofix/review-fix-again.json
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic_federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic_organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.anthropic_service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic_workspace_id }}
      run: node "$GITHUB_ACTION_PATH/sdk.ts"

    - name: Report the review fixer's failure
      if: steps.review-retry.outputs.report == 'true' || steps.review-fix-again.outcome == 'failure'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EXECUTION_FILE: ${{ steps.review-fix-again.outputs.execution_file || steps.review-fix.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/crash.ts" report review
