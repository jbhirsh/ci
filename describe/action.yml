name: Describe
description: >-
  Writes the bots' sections into a PR's or an issue's description: each
  bot's newest section, from its newest upload comment (describe.mjs's
  header says which count), between `<!-- describe:<bot> -->` markers. It
  writes with the Actions token, so its edits start no workflow (PR visuals
  doesn't run again), and hides the uploads it supersedes as outdated,
  never deleting them. Use it as the last job of a bot's workflow, in the
  concurrency group `describe-<repo>-<number>` with cancel-in-progress
  false, so edits to one description take turns; every run rewrites every
  section, so a run GitHub drops from that queue loses nothing. The job
  checks nothing out and needs pull-requests and issues write.

inputs:
  number:
    description: The PR's or the issue's number.
    required: true
  upload-token:
    description: >-
      BOT_PR_TOKEN, the token the bots upload with. Used only to read which
      account it is (an upload comment counts only from that account),
      never to write.
    required: true
  github-token:
    description: The Actions token, which writes the description and hides comments.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Read the upload token's account
      id: login
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.upload-token }}
      # Assigned first, so a failed call fails the step.
      run: |
        login=$(gh api user --jq .login)
        echo "login=$login" >> "$GITHUB_OUTPUT"

    - name: Write the bots' sections
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NUMBER: ${{ inputs.number }}
        BOT_LOGIN: ${{ steps.login.outputs.login }}
      run: node "$GITHUB_ACTION_PATH/run.mjs"
