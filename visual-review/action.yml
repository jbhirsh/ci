name: Visual review
description: >-
  One review of the visual-review workflow (ci#64): a PR's or a mockup's
  screenshot run against main's shots of its base, the `Visual changes`
  status set, and the table handed to the attach job as the artifact
  `visual-review-attach-<kind>-<number>-<run>` (review.ts's header says in what order;
  visual-review/attach puts it in the description, ci#144). Run from a
  checkout of the app's default branch, for its settings, never the PR's:
  it reads the shots only as bytes from the runs' artifacts. It writes
  nothing with BOT_PR_TOKEN. The job needs actions read, contents write
  (enable.mjs turns Dependabot's auto-merge on), statuses, pull-requests
  and issues write, and a concurrency group per PR so its status writes
  take turns.

inputs:
  target:
    description: One entry of the find job's targets, as JSON.
    required: true
  upload-token:
    description: >-
      BOT_PR_TOKEN. Used only to read which account it is, since an upload
      comment from before ci#144 counts only from that account; a review
      fails, saying so, without it, as the attach job uploads with it.
    required: true
  github-token:
    description: The Actions token, for everything else.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false

    # pixelmatch and pngjs, from this repo's lockfile into the action's own
    # checkout, for the comparison.
    - name: Install the comparison's packages
      shell: bash
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH/.."

    - name: Review
      id: review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        UPLOAD_TOKEN: ${{ inputs.upload-token }}
        TARGET: ${{ inputs.target }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        OWNER: ${{ github.repository_owner }}
        HANDOFF_DIR: ${{ runner.temp }}/visual-review-attach
      run: node "$GITHUB_ACTION_PATH/run.ts"

    # One artifact a target, named for its kind, number and screenshot run
    # (two PRs with the same head share a run), which the attach leg for the
    # same target downloads. Kept a day: it is read once, in this
    # same workflow run.
    - name: Hand the table to the attach job
      if: steps.review.outputs.handoff == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: visual-review-attach-${{ fromJSON(inputs.target).kind }}-${{ fromJSON(inputs.target).number }}-${{ fromJSON(inputs.target).run }}
        path: ${{ runner.temp }}/visual-review-attach
        if-no-files-found: error
        retention-days: 1
        # A re-run of the job replaces its first attempt's.
        overwrite: true
