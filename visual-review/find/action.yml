name: Visual review, find
description: >-
  The first job of the visual-review workflow (ci#64): which reviews the
  event calls for (find.mjs's header), as JSON for the review and attach
  jobs' matrices, each with its PR's or mockup issue's number (a mockup's
  from its shots' manifest, downloaded here). Run from a checkout of the
  app's default branch, for its `visual-review` settings; it runs nothing
  of a PR's. Needs actions, contents, pull-requests and statuses read.

inputs:
  github-token:
    description: The Actions token.
    default: ${{ github.token }}

outputs:
  targets:
    description: The reviews to do, a JSON list of { kind, number, run }.
    value: ${{ steps.find.outputs.targets }}
  any:
    description: Whether there is any.
    value: ${{ steps.find.outputs.any }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false

    - name: Find the reviews this event calls for
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        # One-off (ci#144 V2 in fog): a PR into a scratch base counts as into main.
        DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
      run: node "$GITHUB_ACTION_PATH/../find.mjs"
