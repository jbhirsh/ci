name: PR changes
description: >-
  Fills a PR description's change slots from its commits (changes.mjs's
  header says the rules): under Changes the author places an empty
  `<!-- pr-changes:change:N -->` pair for each change, and the Nth commit by
  someone other than a bot (or a merge) goes in it: a title line (the
  number, the subject in bold and the linked sha last) and a closed list of
  its files, each linked to its diff. The author writes only why, in
  bullets under the pair; there is no heading to write. The line
  counts are small coloured pictures, so they read in the GitHub app as well
  as on the web (counts.mjs says what and why); run.mjs's header says how
  they are attached. When the slots and the commits differ in number it writes
  a warning line into every slot (and a workflow warning), so no stale commit
  stays.

  Run it from a workflow of its own on `pull_request_target`, types opened,
  reopened, synchronize and edited (edited, so a slot the author adds by hand
  is filled), in its own concurrency group `pr-changes-<repo>-<number>` with
  cancel-in-progress false. It must not share describe's group: GitHub keeps
  one pending run per group, so the two would cancel each other's pending
  runs, and describe relies on its next run rewriting every section. The run
  re-reads the description just before writing and works its edit out again if
  a person changed it meanwhile. The job needs pull-requests write and
  contents read.

  READ THIS BEFORE CHANGING THE JOB. `pull_request_target` runs the workflow
  as it is on the app's default branch, never the PR's copy, and it may hold a
  person's token (`token`, below). That is safe only because this action
  never checks out or runs the PR's code: it reads the PR's commits and
  description as data through the API. Checking out the PR in this job would
  make it unsafe. So, in the job and in everything it runs:
    - check out nothing (if settings are ever needed, the default branch by
      name, with `persist-credentials: false`);
    - restore and save no cache: its scope is the base branch's;
    - put no PR title, body, branch or commit field in a `run:` line or an
      expression; only the PR's number, through `env:`;
    - the person's token is `UPLOAD_TOKEN`, passed only to the `gh … --attach`
      call, the final description write of the change slots, the one description
      edit the Revisions step builds (and to the step that reads its account
      name), and removed from the run's environment once read; `GH_TOKEN` stays
      the Actions token for every other call;
    - an uploaded file's name comes only from its content hash and size.
  A change to an app's workflow for it takes effect once it is on the default
  branch. Dependabot's PRs get the token here too, which is harmless: their
  descriptions place no slots, and bot commits are skipped.

  A run woken by the token's own edit (the upload's own, or a hand edit where
  the token is a person's) uploads only while the description has no index block of
  pictures yet (an upload that failed leaves it empty), so the upload's own edit finds the index and does nothing, and
  an author's first edit still gets its pictures. What it can't do: GitHub
  keeps one waiting run per group, so if a push's run was waiting when an
  upload's edit, or the final write's, queued its own, the push's run is
  replaced: its new counts stay plain text until the next event (and its
  Revisions row is not written when the table doesn't exist yet); and where the token is the owner's own account, a hand edit that adds
  pairs to a description that already has an index doesn't upload (the next
  push does).

  The final write of the change slots uses the person's token too, when there
  is one: an edit by the Actions token starts no workflow, so the app's
  description check, which ran on the description from before the fill, would
  stay red on a correct one until the next edit. The person's edit starts it
  again on the final text. The edit queues at most one more run of this action,
  which finds nothing to change and writes nothing. If the person's token
  cannot write the description, the run says so and writes it with the Actions
  token once, so the fill is not lost (the check may then stay red until the
  description is edited).

  It also keeps the Revisions table (`revisions`, below; revisions.mjs says
  the rules): once a push or a force-push has moved the PR's head, it adds a
  row for the new head inside the description's `<!-- pr-changes:revisions -->`
  pair (with `## Revisions` and row 1 for the head the PR opened at, the first
  time); a PR with one head gets nothing. A description with no revisions marker
  at all (rewritten without the template's pair) gets the empty pair back first,
  when a push has moved the head. The first write of a table lists the heads
  before it from the PR's timeline (read with the Actions token; revisions.mjs
  says what that gives, and what it does not). The row is written after the change
  slots, with the person's token (`token`), because an edit by the Actions
  token starts no workflow: the description check, which reads the table's
  current row for the PR's head, runs again on the edit and supersedes the run
  for the push, which read the old description. A same-repo PR that needs a row
  and has no token fails this job (never a required check), saying why; a
  fork's PR only gets a notice.

  An app's caller workflow, and the `autofix.exempt` entry it needs in
  `.github/ci.json` (with its reason, or `autofix/check-triggers.mjs` fails the
  app's CI), are in this repository's CONTRIBUTING.md, under "PR changes".

inputs:
  number:
    description: The PR's number.
    required: true
  token:
    description: >-
      A person's token that may attach files (fine-grained: Contents, Pull
      requests and Issues read and write on the app), such as the apps'
      BOT_PR_TOKEN. GitHub refuses the Actions token for attachments. Empty:
      the counts are plain text, and the run says why. Never pass it for a
      fork's PR.
    default: ""
  github-token:
    description: The Actions token, which reads the commits and writes the description.
    default: ${{ github.token }}
  revisions:
    description: >-
      "true" keeps the Revisions table as described above; "false" leaves it
      to the author, as before this existed.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false

    # `--attach` came in gh 2.99 (lib/gh.mjs). The runner's image installs gh
    # from GitHub's own apt source, so an image whose gh lags upgrades from it.
    - name: A gh that can attach
      if: inputs.token != ''
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../lib/gh.mjs" check || {
          sudo apt-get update -q && sudo apt-get install -y -q --only-upgrade gh
          node "$GITHUB_ACTION_PATH/../lib/gh.mjs" check
        }

    # The account the token posts as, so a run woken by an edit from that account
    # (an upload's own, or a hand edit under a person's token) can be told.
    - name: The token's account
      id: login
      if: inputs.token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      # Assigned first, so a failed call fails the step.
      run: |
        login=$(gh api user --jq .login)
        echo "login=$login" >> "$GITHUB_OUTPUT"

    - name: Fill the change slots
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        UPLOAD_TOKEN: ${{ inputs.token }}
        TOKEN_LOGIN: ${{ steps.login.outputs.login }}
        EVENT_ACTION: ${{ github.event.action }}
        SENDER: ${{ github.event.sender.login }}
        NUMBER: ${{ inputs.number }}
      run: node "$GITHUB_ACTION_PATH/run.mjs"

    # After the slots, so the one edit event the description check sees carries
    # the finished description. `!cancelled()`: a failed fill doesn't skip it.
    - name: Write the Revisions row
      if: ${{ !cancelled() && inputs.revisions == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        UPLOAD_TOKEN: ${{ inputs.token }}
        BEFORE: ${{ github.event.before }}
        NUMBER: ${{ inputs.number }}
      run: node "$GITHUB_ACTION_PATH/revisions-run.mjs"
