name: Dependabot auto-merge
description: >-
  Turns on GitHub's auto-merge for one of Dependabot's npm pull requests,
  once, as a rebase merge: the one method all four repositories allow (this
  one allows no other), and for a one-commit bump it lands the same commit a
  squash would. Dependabot can't enable auto-merge on its own PRs. The apps
  get this from their autofix workflow, which runs enable.mjs whenever a
  check on a bot's PR completes; this action is for a repository without
  autofix (this one), whose workflow calls it when CI completes
  (workflow_run: a run on that event puts no check on the PR, so PRs don't
  list a skipped "Enable auto-merge" row). GitHub then merges the PR only
  when the branch rule on main is satisfied: every required check green and
  every review thread resolved. The branch rule is the gate; keep it listing
  every check a PR runs.

  npm only: the Actions token can't merge a PR that edits .github/workflows,
  so bumps from the github-actions ecosystem are merged by hand. It checks
  out nothing and runs none of the PR's code. The job needs contents and
  pull-requests write.

inputs:
  github-token:
    description: A token with contents and pull-requests write.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    # The run's PR from workflow_run; from a pull_request event too, for an
    # app whose dependabot-merge.yml hasn't gone yet (its autofix does this
    # now).
    - name: Enable auto-merge (rebase)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
      run: node "$GITHUB_ACTION_PATH/enable.mjs"
