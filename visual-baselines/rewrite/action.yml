name: Visual baselines, rewrite
description: >-
  Rewrites the visual regression's baselines on this Linux runner, the
  machine they must match, and pushes to the branch the workflow ran on
  the ones that really changed, the new ones, and the deletion of any no
  test takes (rewrite.mjs's header says how): for an app whose own command
  writes them, Playwright's --update-snapshots in BoardGames and
  fog-and-frontier.
  The only step of the app's by-hand visual-baselines.yml after its
  checkout. Without `verify` in the app's settings it adds a commit, and
  the job needs contents write; the Actions token's push queues the PR's
  workflows, each waiting for a maintainer to approve it. With `verify`
  it's all-or-nothing (carry.mjs's header): it waits up to 15 minutes for
  the head commit's checks, refuses unless all but the visual one passed,
  adds the baselines to that commit, runs the visual check's command
  itself, and carries every other result over, so nothing runs again;
  the job then needs contents, checks and actions write, and about an
  hour.

inputs:
  github-token:
    description: >-
      Reads the branch rule and the head commit's checks, posts the
      results onto the amended commit (checks write) and cancels the runs
      its push holds for approval (actions write); used only with
      `verify`. The push goes out with the checkout's credentials.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install the app's dependencies
      shell: bash
      run: npm ci

    - name: Rewrite the baselines
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REWRITTEN_BY: ${{ github.workflow }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
      run: node "$GITHUB_ACTION_PATH/../rewrite.mjs"

    # Playwright's, when its command (or verify's) failed.
    - uses: actions/upload-artifact@v7
      if: failure() || cancelled()
      with:
        name: visual-baselines-report
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 14
