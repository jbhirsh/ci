<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job report</title>
    <!-- jbhirsh/ci job-summary's report page. report.mjs writes the run's model
     (model.mjs) into its script, as a value; the page loads nothing else. -->
    <style>
      /* Layout: one working column like a CI log page; summary strip, then charts, then the test tree. */
      :root {
        --bg: #f7f8fa;
        --surface: #ffffff;
        --fg: #1c2230;
        --muted: #5d6677;
        --line: #dfe3ea;
        --soft: #eef1f5;
        --accent: #2f5fd0;
        --bar: #7d99e0;
        --ok: #1f8a4c;
        --warn: #b7791f;
        --warn-bar: #e0a33a;
        --bad: #c8323a;
        --tip-bg: #1c2230;
        --tip-fg: #f2f4f8;
        --hl-key: #8a3ab9;
        --hl-str: #0a7a43;
        --hl-num: #b04a00;
        --hl-com: #7c8596;
        --hl-fn: #2f5fd0;
        --hl-prop: #9a3412;
        --mark: #ffe58a;
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #12151b;
          --surface: #1a1e26;
          --fg: #e4e8ef;
          --muted: #98a2b3;
          --line: #2c323d;
          --soft: #222833;
          --accent: #7ea2ff;
          --bar: #5876c4;
          --ok: #4cc27f;
          --warn: #e7b456;
          --warn-bar: #c48b2a;
          --bad: #ff6b72;
          --tip-bg: #e4e8ef;
          --tip-fg: #12151b;
          --hl-key: #d39bff;
          --hl-str: #7fd6a0;
          --hl-num: #ffb27a;
          --hl-com: #7f8899;
          --hl-fn: #8fb0ff;
          --hl-prop: #f0a37a;
          --mark: #6b5a12;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #12151b;
        --surface: #1a1e26;
        --fg: #e4e8ef;
        --muted: #98a2b3;
        --line: #2c323d;
        --soft: #222833;
        --accent: #7ea2ff;
        --bar: #5876c4;
        --ok: #4cc27f;
        --warn: #e7b456;
        --warn-bar: #c48b2a;
        --bad: #ff6b72;
        --tip-bg: #e4e8ef;
        --tip-fg: #12151b;
        --hl-key: #d39bff;
        --hl-str: #7fd6a0;
        --hl-num: #ffb27a;
        --hl-com: #7f8899;
        --hl-fn: #8fb0ff;
        --hl-prop: #f0a37a;
        --mark: #6b5a12;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 var(--sans);
        padding-block: 20px 48px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      .page {
        max-width: 1040px;
        margin: 0 auto;
        display: grid;
        gap: 20px;
      }
      header.top {
        display: grid;
        gap: 6px;
      }
      .crumbs {
        font-size: 13px;
        color: var(--muted);
      }
      .crumbs a {
        color: var(--accent);
        text-decoration: none;
      }
      h1 {
        font-size: 22px;
        margin: 0;
        text-wrap: balance;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
      }
      .pill {
        font-size: 13px;
        font-weight: 600;
        padding: 2px 10px;
        border-radius: 999px;
        border: 1px solid currentColor;
      }
      .pill.bad {
        color: var(--bad);
      }
      .pill.ok {
        color: var(--ok);
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        font-size: 13px;
        color: var(--muted);
      }
      .facts b {
        color: var(--fg);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .facts .slow {
        color: var(--warn);
        font-weight: 600;
      }
      section.card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px 18px;
        display: grid;
        gap: 12px;
        min-width: 0;
      }
      h2 {
        font-size: 15px;
        margin: 0;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      h2 small {
        font-weight: 400;
        color: var(--muted);
        font-size: 12px;
      }
      .attention {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .attention li {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 10px;
        align-items: baseline;
        padding: 4px 6px;
        margin: 0 -6px;
        border-radius: 6px;
        cursor: pointer;
      }
      .attention li:hover {
        background: var(--soft);
      }
      .attention li:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .attention .go {
        color: var(--accent);
        font-size: 12px;
        white-space: nowrap;
        margin-left: 6px;
      }
      @keyframes flash {
        from {
          background: var(--mark);
        }
        to {
          background: transparent;
        }
      }
      .flash,
      tr.flash td {
        animation: flash 1.6s ease-out;
      }
      .tag {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .tag.bad {
        color: var(--bad);
      }
      .tag.warn {
        color: var(--warn);
      }
      .tag.flaky {
        color: var(--accent);
      }
      .attention li > span {
        min-width: 0;
      }
      .attention .msg {
        display: block;
        margin: 6px 0 0;
        font: 12px/1.5 var(--mono);
        background: var(--soft);
        border-left: 3px solid var(--bad);
        padding: 6px 10px;
        border-radius: 4px;
        white-space: pre;
        overflow-x: auto;
        color: var(--fg);
      }
      .chart {
        overflow-x: auto;
      }
      .chart svg {
        display: block;
      }
      .chart text {
        fill: var(--fg);
        font: 12px var(--sans);
      }
      .chart .axis text {
        fill: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .chart .grid line {
        stroke: var(--line);
      }
      .chart .rowbg {
        fill: var(--soft);
      }
      .chart .bar {
        fill: var(--bar);
        cursor: pointer;
      }
      .chart .bar.slow {
        fill: var(--warn-bar);
      }
      .chart .bar.bad {
        fill: var(--bad);
      }
      .chart .bar.this {
        fill: var(--accent);
      }
      .chart .bar:hover,
      .chart .bar:focus {
        stroke: var(--fg);
        stroke-width: 1.5;
        outline: none;
      }
      .chart .usual {
        stroke: var(--fg);
        stroke-dasharray: 3 3;
        fill: none;
      }
      .chart .band {
        fill: var(--soft);
      }
      .minibars {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 24px;
        border-bottom: 1px solid var(--line);
        width: max-content;
      }
      .minibars .b {
        width: 9px;
        background: var(--bar);
        border-radius: 1px 1px 0 0;
        display: block;
      }
      .minibars a.b:hover,
      .minibars a.b:focus-visible {
        background: var(--accent);
        outline: none;
      }
      .minibars .b.this {
        background: var(--accent);
      }
      .minibars .b.slow {
        background: var(--warn-bar);
      }
      .minibars .b.bad {
        background: var(--bad);
      }
      .minibars .none {
        width: 9px;
        height: 1px;
      }
      .delta {
        color: var(--warn);
        font-weight: 600;
        margin-right: 4px;
        cursor: help;
      }
      .tree .row .num {
        white-space: nowrap;
      }
      .chart .bandlabel {
        fill: var(--muted);
        font-size: 11px;
      }
      .chart .bandlabel.link {
        cursor: pointer;
        text-decoration: underline dotted;
      }
      .chart .badge {
        cursor: pointer;
      }
      .chart .badge circle {
        fill: var(--surface);
        stroke: var(--muted);
      }
      .chart .badge text {
        fill: var(--fg);
        font-size: 11px;
        font-weight: 600;
      }
      .chart .badge:hover circle,
      .chart .badge:focus circle {
        stroke: var(--accent);
        stroke-width: 2;
      }
      .chart .badge:focus {
        outline: none;
      }
      .stepkey {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .stepkey button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 2px 0;
        cursor: pointer;
        text-align: left;
      }
      .stepkey button:hover {
        color: var(--accent);
      }
      .stepkey b {
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border: 1px solid var(--muted);
        border-radius: 50%;
        color: var(--fg);
        font-size: 11px;
        margin-right: 4px;
      }
      .chart text.peaklabel {
        fill: var(--bad);
        font-size: 11px;
        font-weight: 600;
      }
      .chart text.muted-label {
        fill: var(--muted);
        font-weight: 400;
      }
      .chart .bandlabel.link:hover,
      .chart .bandlabel.link:focus {
        fill: var(--accent);
        outline: none;
      }
      .chart .loadline {
        fill: none;
        stroke: var(--bad);
        stroke-width: 2;
      }
      .chart .idleline {
        fill: none;
        stroke: var(--ok);
        stroke-width: 1.5;
      }
      .chart .cursor {
        stroke: var(--fg);
        stroke-width: 1;
      }
      #load-wrap {
        display: grid;
        gap: 10px;
        margin-top: 8px;
      }
      .chart text.inbar {
        fill: var(--surface);
        font-size: 11px;
        font-weight: 600;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
      .chart .label.link {
        fill: var(--accent);
        cursor: pointer;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .legend i {
        display: inline-block;
        width: 12px;
        height: 10px;
        border-radius: 2px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      .tablewrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        user-select: none;
      }
      .sortbtn {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-align: inherit;
      }
      .sortbtn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      th[aria-sort='ascending']::after {
        content: ' ▲';
      }
      th[aria-sort='descending']::after {
        content: ' ▼';
      }
      td.num,
      th.num {
        text-align: right;
      }

      /* A long step name (a command with its flags) is cut short, whole in its
         tooltip, so the timeline and the times stay on the card. */
      .stepname {
        display: block;
        max-width: 24em;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      table.steps td.tl,
      table.steps th.tl {
        width: 42%;
        min-width: 260px;
        padding-inline: 4px;
      }
      .track {
        position: relative;
        height: 16px;
      }
      .track .seg {
        position: absolute;
        top: 2px;
        height: 12px;
        border-radius: 3px;
        background: var(--bar);
        cursor: default;
      }
      .track .seg.slow {
        background: var(--warn-bar);
      }
      .track .seg.bad {
        background: var(--bad);
      }
      .track .seg:hover,
      .track .seg:focus {
        outline: 1.5px solid var(--fg);
        outline-offset: 1px;
      }
      .track .was {
        position: absolute;
        top: 1px;
        height: 14px;
        border: 1px dashed var(--fg);
        border-radius: 3px;
        pointer-events: none;
      }
      .track .tick {
        position: absolute;
        top: 0;
        bottom: 0;
        border-left: 1px solid var(--line);
      }
      .axisrow {
        position: relative;
        height: 16px;
        font-weight: 400;
        font-size: 11px;
        color: var(--muted);
      }
      .axisrow span {
        position: absolute;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .axisrow span:first-child {
        transform: none;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .toolbar input {
        font: inherit;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--fg);
        min-width: 0;
        flex: 1 1 220px;
      }
      .chip {
        font: inherit;
        font-size: 13px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--fg);
        cursor: pointer;
      }
      .chip[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      .chip .n {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        margin-left: 4px;
      }
      .link-btn {
        font: inherit;
        font-size: 13px;
        background: none;
        border: 0;
        color: var(--accent);
        cursor: pointer;
        padding: 4px;
      }
      button:focus-visible,
      input:focus-visible,
      .tree .row:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .tree {
        display: grid;
        font-size: 13px;
      }
      .tree .row {
        display: grid;
        grid-template-columns: 1fr 70px 70px 140px;
        gap: 10px;
        align-items: center;
        padding: 4px 6px;
        border-radius: 6px;
        font-variant-numeric: tabular-nums;
      }
      .tree .row:hover {
        background: var(--soft);
      }
      .tree .row .name {
        min-width: 0;
        display: flex;
        gap: 6px;
        align-items: baseline;
        overflow: hidden;
      }
      .tree .row .name span.t {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tree .row .num {
        text-align: right;
      }
      .tree .row .muted,
      .muted {
        color: var(--muted);
      }
      .tree .group {
        cursor: pointer;
        font-weight: 600;
      }
      .tree .caret {
        display: inline-block;
        width: 12px;
        color: var(--muted);
        transition: transform 0.12s;
      }
      .tree .open > .caret {
        transform: rotate(90deg);
      }
      .tree .count {
        font-weight: 400;
        color: var(--muted);
        font-size: 12px;
      }
      .tree .head {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
      }
      .tree .head:hover {
        background: none;
      }
      .res {
        width: 14px;
        text-align: center;
        flex: none;
      }
      .res.bad {
        color: var(--bad);
      }
      .res.ok {
        color: var(--ok);
      }
      .res.warn {
        color: var(--warn);
      }
      .res.skip {
        color: var(--muted);
      }
      .dots {
        display: flex;
        gap: 3px;
        justify-content: flex-end;
      }
      .dots a {
        width: 11px;
        height: 11px;
        border-radius: 2px;
        background: var(--ok);
        display: block;
      }
      .dots a.bad {
        background: var(--bad);
      }
      .dots a.rerun {
        background: var(--warn-bar);
      }
      .dots a.none {
        background: var(--line);
      }
      .dots a.this {
        outline: 1.5px solid var(--fg);
        outline-offset: 1px;
      }
      .dots a.changed {
        box-shadow: inset 0 -3px 0 var(--fg);
      }
      .dots a:hover,
      .dots a:focus-visible {
        transform: scale(1.35);
        outline: 1.5px solid var(--fg);
        outline-offset: 1px;
      }
      .slowtxt {
        color: var(--warn);
        font-weight: 600;
      }
      .msgmore {
        font: inherit;
        font-size: 12px;
        color: var(--accent);
        background: none;
        border: 0;
        padding: 2px 0 0;
        cursor: pointer;
        display: block;
      }
      .failmsg {
        grid-column: 1 / -1;
        margin: 2px 0 6px 38px;
        font: 12px/1.5 var(--mono);
        background: var(--soft);
        border-left: 3px solid var(--bad);
        padding: 8px 10px;
        border-radius: 4px;
        white-space: pre;
        overflow-x: auto;
      }
      .empty {
        color: var(--muted);
        padding: 10px 6px;
      }
      .tree .row .name a.t {
        color: inherit;
        text-decoration: none;
      }
      .tree .row .name a.t:hover {
        color: var(--accent);
        text-decoration: underline;
      }
      .codebtn {
        font: inherit;
        font-size: 12px;
        color: var(--accent);
        background: none;
        border: 0;
        padding: 0 2px;
        cursor: pointer;
        flex: none;
      }
      .code {
        grid-column: 1 / -1;
        margin: 2px 0 8px 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .code .path {
        font-size: 12px;
        padding: 4px 10px;
        background: var(--soft);
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .code .path a {
        color: var(--accent);
        text-decoration: none;
      }
      .code pre {
        margin: 0;
        padding: 8px 0;
        font: 12px/1.5 var(--mono);
        overflow-x: auto;
        background: var(--surface);
      }
      .code pre span {
        display: block;
        padding: 0 10px;
        white-space: pre;
      }
      .code pre span::before {
        content: attr(data-n);
        display: inline-block;
        width: 3.5ch;
        margin-right: 1.5ch;
        color: var(--muted);
        text-align: right;
      }
      .code pre span.hit {
        background: var(--soft);
        box-shadow: inset 3px 0 var(--bad);
      }
      .code b {
        font-weight: inherit;
      }
      .hl b {
        font-weight: inherit;
      }
      .hl .k {
        color: var(--hl-key);
      }
      .hl .s {
        color: var(--hl-str);
      }
      .hl .n {
        color: var(--hl-num);
      }
      .hl .c {
        color: var(--hl-com);
        font-style: italic;
      }
      .hl .f {
        color: var(--hl-fn);
      }
      .hl .p {
        color: var(--hl-prop);
      }
      .hl .e {
        color: var(--bad);
        font-weight: 650;
      }
      .hl .del {
        color: var(--bad);
      }
      .hl .ins {
        color: var(--ok);
      }
      mark {
        background: var(--mark);
        color: inherit;
        border-radius: 2px;
        padding: 0 1px;
      }
      .tip {
        position: fixed;
        z-index: 20;
        pointer-events: none;
        width: max-content;
        background: var(--tip-bg);
        color: var(--tip-fg);
        font-size: 12px;
        line-height: 1.45;
        padding: 8px 10px;
        border-radius: 8px;
        max-width: 300px;
        box-shadow: 0 6px 20px rgb(0 0 0 / 0.25);
        font-variant-numeric: tabular-nums;
      }
      .tip b {
        font-weight: 650;
      }
      .tip .k {
        opacity: 0.7;
      }
      dl.notes {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 16px;
        margin: 0;
        font-size: 13px;
      }
      dl.notes dt {
        color: var(--muted);
      }
      dl.notes dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 640px) {
        .tree .row {
          grid-template-columns: 1fr 56px 0 0;
        }
        .tree .row > :nth-child(3),
        .tree .row > :nth-child(4) {
          display: none;
        }
        .attention li {
          grid-template-columns: 1fr;
          gap: 2px;
        }
        .failmsg {
          margin-left: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tree .caret {
          transition: none;
        }
      }

      .foot {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }

          const label = svgEl(
            'text',
            { x: W - 84, y: y(data.usual) - 2, class: 'axis', tabindex: 0 },
            svg,
          );
          svgEl('tspan', { x: W - 84 }, label).textContent = 'usual';
          svgEl('tspan', { x: W - 84, dy: 14 }, label).textContent = fmt(data.usual);
          bindTip(
            label,
            () =>
              `<b>Usual: ${fmt(data.usual)}</b><br>The middle time of the earlier runs that passed`,
          );
        }
        $('history').replaceChildren(svg);
      }

      // CPU across the job, on the same time axis as the steps, so a slow step can
      // be read against what the machine was doing then.
      function drawLoad(steps, samples) {
        const total = Math.max(
          data.seconds,
          ...steps.map((st) => st.start + st.seconds),
          ...samples.map((p) => p.t),
          1,
        );
        const W = chartWidth('load'),
          H = 206,
          left = 50,
          right = 46,
          top = 30,
          bottom = 26;
        const x = (t) => left + (t / total) * (W - left - right);
        const yi = (v) => H - bottom - (v / 100) * (H - bottom - top);
        const svg = svgEl('svg', {
          width: W,
          height: H,
          viewBox: `0 0 ${W} ${H}`,
          role: 'img',
          'aria-label': 'CPU over the job',
        });
        const keyed = [];
        steps
          .filter((st) => st.seconds / total > 0.04)
          .forEach((st, k) => {
            const w = x(st.start + st.seconds) - x(st.start);
            svgEl(
              'rect',
              {
                class: 'band',
                x: x(st.start),
                y: top,
                width: w,
                height: H - top - bottom,
                opacity: k % 2 ? 0.45 : 0.9,
              },
              svg,
            );
            // A numbered badge over the band; the names are in the key under the chart.
            const badge = svgEl(
              'g',
              {
                class: 'badge',
                tabindex: 0,
                role: 'link',
                'aria-label': `Step ${st.i}: ${st.name}`,
              },
              svg,
            );
            svgEl('circle', { cx: x(st.start) + 12, cy: top - 12, r: 9 }, badge);
            svgEl(
              'text',
              { x: x(st.start) + 12, y: top - 8, 'text-anchor': 'middle' },
              badge,
            ).textContent = st.i;
            bindTip(
              badge,
              () =>
                `<b>${st.i}. ${esc(st.name)}</b><br><span class="k">Ran</span> ${fmt(st.start)} → ${fmt(st.start + st.seconds)} into the job<br><span class="k">Took</span> ${fmt(st.seconds)}${st.usual ? ` (usual ${fmt(st.usual)})` : ''}<br><span class="k">Click to see it in Steps</span>`,
            );
            badge.addEventListener('click', () => showStep(st.i));
            badge.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') showStep(st.i);
            });
            keyed.push(st);
          });
        $('stepkey').innerHTML = keyed
          .map(
            (st) =>
              `<button type="button" data-step="${st.i}"><b>${st.i}</b> ${esc(st.name)}</button>`,
          )
          .join('');
        $('stepkey')
          .querySelectorAll('button')
          .forEach((b) => b.addEventListener('click', () => showStep(+b.dataset.step)));
        const g = svgEl('g', { class: 'grid' }, svg),
          ax = svgEl('g', { class: 'axis' }, svg);
        for (let v = 0; v <= 100; v += 25) {
          svgEl('line', { x1: left, x2: W - right, y1: yi(v), y2: yi(v) }, g);
          svgEl('text', { x: left - 6, y: yi(v) + 4, 'text-anchor': 'end' }, ax).textContent =
            `${v}%`;
        }
        const step = niceStep(total);
        for (let t = 0; t <= total; t += step)
          svgEl('text', { x: x(t), y: H - 8, 'text-anchor': 'middle' }, ax).textContent = tick(t);
        svgEl(
          'polyline',
          { class: 'loadline', points: samples.map((p) => `${x(p.t)},${yi(p.busy)}`).join(' ') },
          svg,
        );
        $('settle-key').hidden = data.settle == null;
        if (data.settle != null) {
          svgEl(
            'line',
            { class: 'usual', x1: left, x2: W - right, y1: yi(data.settle), y2: yi(data.settle) },
            svg,
          );
          svgEl(
            'text',
            {
              x: W - right - 4,
              y: yi(data.settle) - 5,
              'text-anchor': 'end',
              class: 'peaklabel muted-label',
            },
            svg,
          ).textContent = `settle wait's limit, ${data.settle}% busy`;
        }
        // The peak, on the line, labelled on whichever side has room.
        const peak = samples.reduce((a, c) => (c.busy > a.busy ? c : a));
        svgEl(
          'circle',
          {
            cx: x(peak.t),
            cy: yi(peak.busy),
            r: 4,
            fill: 'var(--bad)',
            stroke: 'var(--surface)',
            'stroke-width': 2,
          },
          svg,
        );
        const peakText = `peak ${Math.round(peak.busy)}% at ${fmt(peak.t)}`;
        const onLeft = x(peak.t) - 8 - peakText.length * 6.2 > left + 4;
        svgEl(
          'text',
          {
            x: x(peak.t) + (onLeft ? -8 : 8),
            y: yi(peak.busy) + (onLeft ? 4 : 16),
            'text-anchor': onLeft ? 'end' : 'start',
            class: 'peaklabel',
          },
          svg,
        ).textContent = peakText;
        const cursor = svgEl(
          'line',
          { class: 'cursor', x1: 0, x2: 0, y1: top, y2: H - bottom, visibility: 'hidden' },
          svg,
        );
        const hit = svgEl(
          'rect',
          {
            x: left,
            y: top,
            width: W - left - right,
            height: H - top - bottom,
            fill: 'transparent',
          },
          svg,
        );
        hit.addEventListener('mousemove', (e) => {
          const b = svg.getBoundingClientRect();
          const t = (((e.clientX - b.left) * (W / b.width) - left) / (W - left - right)) * total;
          const p = samples.reduce((a, c) => (Math.abs(c.t - t) < Math.abs(a.t - t) ? c : a));
          const st = steps.find((q) => p.t >= q.start && p.t < q.start + q.seconds);
          cursor.setAttribute('x1', x(p.t));
          cursor.setAttribute('x2', x(p.t));
          cursor.setAttribute('visibility', 'visible');
          showTip(
            e,
            `<b>${fmt(p.t)} into the job</b><br><span class="k">CPU busy</span> ${Math.round(p.busy)}%<br><span class="k">Load average</span> ${p.load} (1 minute)${st ? `<br><span class="k">Step</span> ${st.i}. ${esc(st.name)}` : ''}`,
          );
        });
        hit.addEventListener('mouseleave', () => {
          cursor.setAttribute('visibility', 'hidden');
          hideTip();
        });
        $('load').replaceChildren(svg);
      }

      // The steps: a row each, with its bar where it ran in the job, its times
      // and its recent runs.
      function drawSteps(steps, total) {
        const step = niceStep(total);
        const ticks = [];
        for (let t = 0; t <= total; t += step) ticks.push(t);
        const at = (t) => (t / total) * 100;
        const axis = `<div class="axisrow">${ticks.map((t) => `<span style="left:${at(t)}%">${tick(t)}</span>`).join('')}</div>`;
        const cols = [
          ['#', 'i', 'num'],
          ['Step', 'name', ''],
          [axis, null, 'tl'],
          ['This run', 'seconds', 'num'],
          ['Usual', 'usual', 'num'],
          ['Change', 'change', 'num'],
          ['Last runs', null, ''],
        ];
        const rows = steps.map((s) => ({
          ...s,
          change: s.usual ? s.seconds / s.usual - 1 : -Infinity,
        }));
        const { key, dir } = state.sort;
        if (key) rows.sort((a, b) => (a[key] > b[key] ? 1 : a[key] < b[key] ? -1 : 0) * dir);
        const grid = ticks.map((t) => `<i class="tick" style="left:${at(t)}%"></i>`).join('');
        const t = $('steps');
        // A sortable column's header is a button, for the keyboard and screen
        // readers too; the column sorted says which way.
        const head = ([h, k, c]) =>
          k
            ? `<th class="${c}" aria-sort="${k === key ? (dir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" class="sortbtn" data-k="${k}">${h}</button></th>`
            : `<th class="${c}">${h}</th>`;
        t.innerHTML = `<thead><tr>${cols.map(head).join('')}</tr></thead><tbody>${rows
          .map((s) => {
            const cls = s.conclusion === 'failure' ? 'bad' : s.slower ? 'slow' : '';
            const was =
              s.slower && s.usual
                ? `<i class="was" style="left:${at(s.start)}%;width:${at(s.usual)}%"></i>`
                : '';
            const change = s.usual
              ? `${Math.round(s.change * 100) >= 0 ? '+' : ''}${Math.round(s.change * 100)}%`
              : '–';
            return `<tr id="step-${s.i}"><td class="num muted">${s.i}</td><td><span class="stepname" title="${esc(s.name)}">${s.conclusion === 'failure' ? '<span class="res bad">✖</span> ' : ''}${esc(s.name)}</span></td><td class="tl"><div class="track">${grid}<i class="seg ${cls}" tabindex="0" data-step="${s.i - 1}" style="left:${at(s.start)}%;width:max(3px, ${at(s.seconds)}%)"></i>${was}</div></td><td class="num ${s.slower ? 'slowtxt' : ''}">${fmt(s.seconds)}</td><td class="num muted">${s.usual == null ? 'n/a' : fmt(s.usual)}</td><td class="num ${s.slower ? 'slowtxt' : 'muted'}">${change}</td><td>${spark(s)}</td></tr>`;
          })
          .join('')}</tbody>`;
        t.querySelectorAll('.sortbtn').forEach((b) =>
          b.addEventListener('click', () => {
            const k = b.dataset.k;
            state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : 1 };
            drawSteps(steps, total);
            t.querySelector(`.sortbtn[data-k="${k}"]`)?.focus();
          }),
        );
        t.querySelectorAll('.seg').forEach((el) => {
          const s = steps[+el.dataset.step];
          bindTip(
            el,
            () =>
              `<b>${esc(s.name)}</b><br><span class="k">Ran</span> ${fmt(s.start)} → ${fmt(s.start + s.seconds)} into the job<br><span class="k">This run</span> ${fmt(s.seconds)}${s.conclusion === 'failure' ? ' · failed' : ''}<br><span class="k">Usual</span> ${s.usual == null ? 'not enough earlier runs' : fmt(s.usual) + (s.slower ? ` (${pct(s.seconds, s.usual)})` : '')}`,
          );
        });
        t.querySelectorAll('[data-spark]').forEach((el) => {
          const s = steps[+el.dataset.spark];
          el.querySelectorAll('.b').forEach((bar) =>
            bindTip(bar, () => {
              const i = +bar.dataset.i;
              const v = i === N ? s.seconds : s.past[i];
              return `<b>${runName(i)}</b><br><span class="k">${esc(s.name)}</span><br><span class="k">Time</span> ${fmt(v)}${s.usual ? ` (usual ${fmt(s.usual)})` : ''}${i === N ? '' : '<br><span class="k">Click to open that run</span>'}`;
            }),
          );
        });
      }
      // A step's recent runs as small bars from zero, to scale with each other:
      // one per run, oldest first, this run last; each opens its run.
      function spark(s) {
        // As many earlier times as there are earlier runs, this run's last.
        const all = [
          ...s.past.slice(0, N),
          ...Array(Math.max(0, N - s.past.length)).fill(null),
          s.seconds,
        ];
        const vals = all.filter((v) => v != null);
        const max = Math.max(...vals, 0.001);
        return `<span class="minibars" data-spark="${s.i - 1}">${all
          .map((v, i) => {
            if (v == null) return `<span class="none" title="Didn't run"></span>`;
            const h = Math.max(2, Math.round((v / max) * 22));
            if (i === N)
              return `<span class="b ${s.conclusion === 'failure' ? 'bad' : s.slower ? 'slow' : 'this'}" data-i="${i}" style="height:${h}px"></span>`;
            return `<a class="b" data-i="${i}" href="${esc(data.runs[i].url)}" target="_blank" rel="noopener" aria-label="Run #${data.runs[i].number}: ${fmt(v)}" style="height:${h}px"></a>`;
          })
          .join('')}</span>`;
      }

      // The tests: a tree of folders, files and describe blocks, or a flat list
      // of flows; filters for the groups worth reading.
      function drawTests() {
        const g = groups;
        const filters = [
          ['all', 'All', tests],
          ['failed', 'Failed', g.failed],
          ['slower', 'Slower', g.slower],
          ['flaky', 'Flaky', g.flaky],
          ['rerun', 'Re-run', g.rerun],
        ];
        $('chips').innerHTML = filters
          .filter(([k, , l]) => k === 'all' || l.length)
          .map(
            ([k, label, l]) =>
              `<button type="button" class="chip" data-f="${k}" aria-pressed="${state.filter === k}">${label}<span class="n">${l.length}</span></button>`,
          )
          .join('');
        $('chips')
          .querySelectorAll('.chip')
          .forEach((c) =>
            c.addEventListener('click', () => {
              state.filter = c.dataset.f;
              // All: the groups holding failures open, as at load; a filter: everything.
              state.open = new Set(state.filter === 'all' ? failedGroups() : ['*']);
              drawTests();
            }),
          );
        const tree = tests.some((t) => t.file);
        $('tests-title').innerHTML =
          `${Nouns} <small>${tests.length} ${nouns} · ${g.failed.length} failed · ${g.slower.length} slower · ${g.flaky.length} flaky · ${tree ? 'by folder, file and describe block, ' : ''}slowest first</small>`;
        const q = state.q.trim().toLowerCase();
        const pool = (
          state.filter === 'all' ? tests : filters.find((f) => f[0] === state.filter)[2]
        ).filter(
          (t) => !q || `${t.folder}${t.file} ${t.block} ${t.title}`.toLowerCase().includes(q),
        );
        const html = [
          `<div class="row head"><span>Name</span><span class="num">This run</span><span class="num">Usual</span><span class="num">Last ${N + 1} runs</span></div>`,
        ];
        if (!pool.length) html.push(`<div class="empty">No ${nouns} match.</div>`);
        const sum = (l) => l.reduce((n, t) => n + t.seconds, 0);
        const usum = (l) =>
          l.every((t) => t.usual != null) ? l.reduce((n, t) => n + t.usual, 0) : null;
        const groupBy = (l, k) => {
          const m = new Map();
          l.forEach((t) => {
            const key = k(t);
            if (!m.has(key)) m.set(key, []);
            m.get(key).push(t);
          });
          return [...m].sort((a, b) => sum(b[1]) - sum(a[1]));
        };
        const isOpen = (id) => Boolean(q) || state.open.has('*') || state.open.has(id);
        const groupRow = (id, depth, label, list) => {
          const bad = list.some((t) => t.result === 'failed');
          return `<div class="row group" role="treeitem" tabindex="0" aria-expanded="${isOpen(id)}" data-id="${esc(id)}" style="padding-left:${6 + depth * 18}px"><span class="name ${isOpen(id) ? 'open' : ''}"><span class="caret">▸</span>${bad ? '<span class="res bad">✖</span>' : ''}<span class="t">${marked(label)}</span> <span class="count">${list.length}</span></span><span class="num">${fmt(sum(list))}</span><span class="num muted">${fmt(usum(list))}</span><span></span></div>`;
        };
        const leaf = (t, depth) => {
          const ti = tests.indexOf(t);
          const res =
            t.result === 'failed'
              ? ['bad', '✖']
              : t.result === 'passed on re-run'
                ? ['warn', '↻']
                : t.result === 'skipped'
                  ? ['skip', '–']
                  : ['ok', '✓'];
          const dots = [
            ...t.hist.slice(0, N),
            ...Array(Math.max(0, N - t.hist.length)).fill(''),
            t.result,
          ]
            .map((h, i) => {
              const cls = `${h === 'failed' ? 'bad' : h === 'passed on re-run' ? 'rerun' : h === '' || h === 'skipped' ? 'none' : ''} ${i === N ? 'this' : ''} ${t.edited.includes(i) ? 'changed' : ''}`;
              const href = i === N ? (data.run?.url ?? '#') : data.runs[i].url;
              return `<a href="${esc(href)}" target="_blank" rel="noopener" aria-label="${runName(i)}: ${esc(h || 'no result')}" class="${cls}" data-h="${i}"></a>`;
            })
            .join('');
          const href =
            t.path && data.run
              ? `https://github.com/${data.repo}/blob/${data.run.sha}/${t.path.split('/').map(encodeURIComponent).join('/')}#L${t.line}`
              : '';
          const codeOpen = state.code.has(ti);
          const yaml = /\.ya?ml$/.test(t.path);
          const code =
            t.code && codeOpen
              ? `<div class="code hl"><div class="path"><span>${esc(t.path)}</span>${href ? `<a href="${esc(href)}" target="_blank" rel="noopener">Open on GitHub ↗</a>` : ''}</div><pre>${t.code.map(([n, line, hit]) => `<span data-n="${n}" class="${hit ? 'hit' : ''}">${highlight(line, yaml)}</span>`).join('')}</pre></div>`
              : '';
          const name = href
            ? `<a class="t" href="${esc(href)}" target="_blank" rel="noopener" title="Open ${esc(t.path)} at line ${t.line}">${marked(t.title)}</a>`
            : `<span class="t">${marked(t.title)}</span>`;
          const slow = t.slower
            ? `<span class="delta" data-slow="${ti}" tabindex="0" aria-label="Slower than usual, ${pct(t.seconds, t.usual)}">⚠</span>`
            : '';
          return `<div class="row" role="treeitem" data-ti="${ti}" style="padding-left:${6 + depth * 18 + 12}px"><span class="name"><span class="res ${res[0]}">${res[1]}</span>${name}${t.code ? `<button type="button" class="codebtn" data-code="${ti}" aria-expanded="${codeOpen}">${codeOpen ? 'Hide code' : 'Show code'}</button>` : ''}</span><span class="num ${t.slower ? 'slowtxt' : ''}">${slow}${fmt(t.seconds)}</span><span class="num muted">${fmt(t.usual)}</span><span class="dots" data-t="${ti}">${dots}</span>${t.message ? message('failmsg', `t${ti}`, t.message, yaml) : ''}${code}</div>`;
        };
        const slowest = (l) => [...l].sort((a, b) => b.seconds - a.seconds);
        if (!tree) {
          slowest(pool).forEach((t) => html.push(leaf(t, -0.7)));
        } else {
          for (const [folder, inF] of groupBy(pool, (t) => t.folder)) {
            const fileDepth = folder ? 1 : 0;
            if (folder) {
              html.push(groupRow(folder, 0, '📁 ' + folder, inF));
              if (!isOpen(folder)) continue;
            }
            for (const [file, inFile] of groupBy(inF, (t) => t.file)) {
              const fid = folder + file;
              if (file) {
                html.push(groupRow(fid, fileDepth, file, inFile));
                if (!isOpen(fid)) continue;
              }
              for (const [block, inB] of groupBy(inFile, (t) => t.block)) {
                const bid = fid + ' › ' + block;
                if (block) {
                  html.push(groupRow(bid, fileDepth + 1, block, inB));
                  if (!isOpen(bid)) continue;
                }
                slowest(inB).forEach((t) => html.push(leaf(t, fileDepth + (block ? 2 : 1))));
              }
            }
          }
        }
        const el = $('tree');
        el.innerHTML = html.join('');
        el.querySelectorAll('.group').forEach((row) => {
          const toggle = () => {
            const id = row.dataset.id;
            if (state.open.has('*')) state.open = new Set(allIds());
            state.open.has(id) ? state.open.delete(id) : state.open.add(id);
            keepFocus(drawTests);
          };
          row.addEventListener('click', toggle);
          row.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggle();
            }
          });
        });
        el.querySelectorAll('[data-slow]').forEach((s) => {
          const t = tests[+s.dataset.slow];
          bindTip(
            s,
            () =>
              `<b>Slower than usual: ${pct(t.seconds, t.usual)}</b><br>${fmt(t.seconds)} this run, usually ${fmt(t.usual)}<br><span class="k">Usual is the middle time of the earlier runs it passed in</span>`,
          );
        });
        el.querySelectorAll('.codebtn').forEach((b) =>
          b.addEventListener('click', () => {
            const i = +b.dataset.code;
            state.code.has(i) ? state.code.delete(i) : state.code.add(i);
            keepFocus(drawTests);
          }),
        );
        el.querySelectorAll('.dots').forEach((d) => {
          const t = tests[+d.dataset.t];
          d.querySelectorAll('a').forEach((dot) =>
            bindTip(dot, () => {
              const i = +dot.dataset.h;
              const r = i === N ? data.run : data.runs[i];
              const h = i === N ? t.result : t.hist[i] || 'no result';
              const time = i === N ? t.seconds : t.times[i];
              const edited = t.edited.includes(i)
                ? `<br>✎ <b>${esc(t.path.split('/').pop())} changed since this branch's previous run</b>`
                : '';
              return `<b>${runName(i)}</b> · ${esc(h)}<br><span class="k">${esc(t.title)}</span>${time != null ? `<br><span class="k">Time</span> ${fmt(time)}` : ''}${r ? `<br><span class="k">Commit</span> ${esc(short(r.sha))} on ${esc(r.branch)}` : ''}${edited}${i === N ? '' : '<br><span class="k">Click to open that run</span>'}`;
            }),
          );
        });
      }

      // Redraws with `draw`, then gives keyboard focus back to the control that
      // had it, found again by its data attribute: a redraw replaces every
      // element, and focus would otherwise fall back to the page.
      function keepFocus(draw) {
        const a = document.activeElement;
        const key = ['data-id', 'data-msg', 'data-code', 'data-go'].find((k) => a?.hasAttribute(k));
        const value = key ? a.getAttribute(key) : null;
        draw();
        if (key)
          [...document.querySelectorAll(`[${key}]`)]
            .find((e) => e.getAttribute(key) === value)
            ?.focus();
      }

      // Scrolls to a place on the page and lights it up for a moment.
      function reveal(el) {
        if (!el) return;
        el.scrollIntoView({
          block: 'center',
          behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
        });
        el.classList.remove('flash');
        void el.offsetWidth;
        el.classList.add('flash');
      }
      function showStep(i) {
        reveal($('step-' + i));
      }
      // Opens the tree down to a test (clearing a filter that hides it), then goes there.
      function showTest(ti) {
        const t = tests[ti];
        const shown = state.filter === 'all' || (groups[state.filter] || []).includes(t);
        if (!shown) state.filter = 'all';
        if (state.q) {
          state.q = '';
          $('q').value = '';
        }
        if (!state.open.has('*'))
          [t.folder, t.folder + t.file, t.folder + t.file + ' › ' + t.block].forEach((id) =>
            state.open.add(id),
          );
        drawTests();
        reveal(document.querySelector(`#tree [data-ti="${ti}"]`));
      }
      function allIds() {
        const ids = [];
        tests.forEach((t) => {
          ids.push(t.folder, t.folder + t.file, t.folder + t.file + ' › ' + t.block);
        });
        return [...new Set(ids)];
      }

      document.addEventListener(
        'click',
        (e) => {
          const b = e.target.closest('.msgmore');
          if (!b) return;
          e.stopPropagation();
          const key = b.dataset.msg;
          openMessages.has(key) ? openMessages.delete(key) : openMessages.add(key);
          keepFocus(key.startsWith('a') ? render : drawTests);
        },
        true,
      );
      $('q').addEventListener('input', (e) => {
        state.q = e.target.value;
        drawTests();
      });
      $('expand').addEventListener('click', () => {
        state.open = new Set(['*']);
        drawTests();
      });
      $('collapse').addEventListener('click', () => {
        state.open = new Set();
        drawTests();
      });
      render();
      let resizing = 0;
      addEventListener('resize', () => {
        cancelAnimationFrame(resizing);
        resizing = requestAnimationFrame(() => redrawCharts());
      });
    </script>
  </body>
</html>
