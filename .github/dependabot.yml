# This repo's dev tools and actions, on the apps' Monday 06:00 UTC slot. The
# apps' own Dependabot bumps the packages these tools import from them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      dev:
        patterns: ["*"]
  - package-ecosystem: github-actions
    # The workflows and every tool's action.yml (a tool's sub-actions sit one
    # folder down): `directory: /` would read only .github/workflows.
    directories: ["/", "/*", "/*/*"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
