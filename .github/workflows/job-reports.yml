# Publishes a CI run's job reports (job-summary) to the repository's GitHub
# Pages, where every job summary links, and keeps one comment on the run's
# pull request with every job's summary. An app calls it as the last job of
# each workflow whose jobs write job summaries:
#
#   reports:
#     needs: [test, e2e]          # every job with a job summary
#     if: ${{ !cancelled() }}     # failed runs are reported too
#     permissions:
#       contents: write
#       actions: read
#       pull-requests: write
#     uses: jbhirsh/ci/.github/workflows/job-reports.yml@main
#
# and serves its job-reports branch on Pages (Settings, Pages: Deploy from a
# branch, job-reports, / (root)). As a job of the run itself, it runs from
# the pull request's own branch, so a change to it takes effect on the pull
# request that makes it, and the run's artifacts come straight from the run
# (actions/download-artifact). It can also be called from a workflow_run
# workflow, after CI finishes, as the apps first did; there it runs from the
# default branch and fetches the finished run's artifacts with gh.
#
# A fork's run isn't published: its code wrote the pages, which would then
# be served from the repository's own site. Nor is Dependabot's, whose token
# can't push or comment. Publishes that overlap don't lose each other's
# reports: each pushes with a lease and tries again on the branch as it
# found it (publish.mjs). This repository's own CI calls it the same way.
#
# Permissions: GitHub won't start a reusable workflow whose jobs ask for
# more than the caller grants (the run fails at startup, with no jobs), and
# a called workflow only keeps or lowers what its caller passes. So nothing
# here is declared at the top: publish asks for exactly what every caller
# has granted from the start, and comment asks for nothing, taking what the
# caller passes. A caller that grants pull-requests: write gets the comment;
# one that doesn't still publishes, and its comment job logs a notice.
name: Job reports

on:
  workflow_call:

jobs:
  publish:
    name: Publish job reports
    if: >-
      github.actor != 'dependabot[bot]' && (
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'workflow_run' && github.event_name != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      # Inside the run, its jobs' reports are artifacts of this same run.
      - name: Take this run's job reports
        if: github.event_name != 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: job-summary-*
          path: ${{ runner.temp }}/job-reports-artifacts
      - uses: jbhirsh/ci/job-summary/publish@main
        with:
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          artifacts: ${{ github.event_name != 'workflow_run' && format('{0}/job-reports-artifacts', runner.temp) || '' }}

  # The pull request's comment (comment.mjs), after the reports it links to
  # are up. Its own job, so only it takes turns: runs for one branch write
  # the comment one at a time, each reading it again just before writing.
  # GitHub keeps one waiting job per group and cancels an older waiting one
  # when another comes; the newer run writes the comment then, keeping the
  # cancelled run's workflow's last sections, labelled as from an earlier
  # commit until that workflow's next run. Publishing never waits on this.
  # A push has no pull request to comment on.
  comment:
    name: Comment on the pull request
    needs: publish
    if: >-
      github.actor != 'dependabot[bot]' && (
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: job-reports-comment-${{ github.event.workflow_run.head_branch || github.head_ref }}
      cancel-in-progress: false
    steps:
      - name: Take this run's job reports
        if: github.event_name != 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: job-summary-*
          path: ${{ runner.temp }}/job-reports-artifacts
      - uses: jbhirsh/ci/job-summary/comment@main
        with:
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          artifacts: ${{ github.event_name != 'workflow_run' && format('{0}/job-reports-artifacts', runner.temp) || '' }}
