# Publishes each CI run's job reports (job-summary) to the repository's
# GitHub Pages, where every job summary links, and keeps one comment on the
# run's pull request with every job's summary. An app calls it from its own
# workflow, which runs when CI finishes:
#
#   name: Job reports
#   on:
#     workflow_run:
#       workflows: [CI]
#       types: [completed]
#   permissions:
#     contents: write
#     actions: read
#     pull-requests: write
#   jobs:
#     publish:
#       uses: jbhirsh/ci/.github/workflows/job-reports.yml@main
#
# and serves its job-reports branch on Pages (Settings, Pages: Deploy from a
# branch, job-reports, / (root)). A fork's run isn't published: its code
# wrote the pages, which would then be served from the repository's own
# site. Publishes that overlap don't lose each other's reports: each pushes
# with a lease and tries again on the branch as it found it (publish.mjs).
# This repository's own CI calls it the same way (own-job-reports.yml).
#
# Permissions: GitHub won't start a reusable workflow whose jobs ask for
# more than the caller grants (the run fails at startup, with no jobs), and
# a called workflow only keeps or lowers what its caller passes. So nothing
# here is declared at the top: publish asks for exactly what every caller
# has granted from the start, and comment asks for nothing, taking what the
# caller passes. A caller that grants pull-requests: write gets the comment;
# one that doesn't still publishes, and its comment job logs a notice.
name: Job reports

on:
  workflow_call:

jobs:
  publish:
    name: Publish job reports
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: jbhirsh/ci/job-summary/publish@main
        with:
          run-id: ${{ github.event.workflow_run.id }}

  # The pull request's comment (comment.mjs), after the reports it links to
  # are up. Its own job, so only it takes turns: runs for one branch write
  # the comment one at a time, each reading it again just before writing.
  # GitHub keeps one waiting job per group and cancels an older waiting one
  # when another comes; the newer run writes the comment then, keeping the
  # cancelled run's workflow's last sections, labelled as from an earlier
  # commit until that workflow's next run. Publishing never waits on this.
  # A push to the default branch has no pull request to comment on.
  comment:
    name: Comment on the pull request
    needs: publish
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: job-reports-comment-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: jbhirsh/ci/job-summary/comment@main
        with:
          run-id: ${{ github.event.workflow_run.id }}
