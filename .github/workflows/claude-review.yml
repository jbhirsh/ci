name: Claude Review

# AI code review on every PR to main, by the review action the apps use
# (review/action.yml says what it does and what it leaves to CI). It runs
# that action from main, not from the PR: a PR is reviewed by the reviewer
# already merged, never by the copy it changes. This repo has no
# .github/ci.json "review" key, so the defaults apply.
#
# claude-code-action skips (and still reports success on) a PR that edits the
# workflow file it runs from, so only a PR that edits this file goes
# unreviewed. The job's `name:` is a required status check.
on:
  pull_request:
    branches: [main]

# A new push supersedes the review of the previous head.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Run the JavaScript actions (claude-code-action et al.) on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # claude-code-action uses the job's OIDC token for the Claude GitHub
      # App's token, and for a Claude API token (federation, below).
      id-token: write
    steps:
      - uses: jbhirsh/ci/review@main
        with:
          # Signs in by workload identity federation (the Anthropic Console's
          # Workload identity): the job's OIDC token for a short-lived Claude
          # API token, so no secret is stored. These IDs aren't secret.
          anthropic_federation_rule_id: fdrl_01BuwYpezaN3Vw9dbwvdF5JY
          anthropic_organization_id: 22970ab4-b9f2-4f4b-a7d7-d2e0bab4fcac
          anthropic_service_account_id: svac_01UZj2itXNdhewkTjp9Wv6YG
          anthropic_workspace_id: wrkspc_01GbH32ibMELoz7yNtpC8bB6
