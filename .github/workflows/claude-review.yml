name: Claude Review

# AI code review on every PR to main, by the review action the apps use
# (review/action.yml says what it does and what it leaves to CI). It runs
# that action from main, not from the PR: a PR is reviewed by the reviewer
# already merged, never by the copy it changes. This repo's
# .github/ci.json turns on the Opus advisor and leaves Dependabot's own
# bumps unreviewed. The job's `name:` is a required status check.
on:
  pull_request:
    branches: [main]

# A new push supersedes the review of the previous head.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Run the JavaScript actions (checkout, setup-node, cache) on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # The job's OIDC token, traded for a Claude API token (federation,
      # below).
      id-token: write
    steps:
      - uses: jbhirsh/ci/review@main
        with:
          # Signs in by workload identity federation (the Anthropic Console's
          # Workload identity): the job's OIDC token for a short-lived Claude
          # API token, so the API sign-in needs no stored secret. These IDs
          # aren't secret.
          anthropic_federation_rule_id: fdrl_01BuwYpezaN3Vw9dbwvdF5JY
          anthropic_organization_id: 22970ab4-b9f2-4f4b-a7d7-d2e0bab4fcac
          anthropic_service_account_id: svac_01UZj2itXNdhewkTjp9Wv6YG
          anthropic_workspace_id: wrkspc_01GbH32ibMELoz7yNtpC8bB6
          # The owner's Claude subscription, which a pass the API refuses for
          # credit or a limit is retried on (review/sdk.mjs). An Actions and a
          # Dependabot secret, since Dependabot's PRs see only the latter.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
