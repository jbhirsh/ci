# Turn on GitHub's auto-merge for each of Dependabot's npm PRs once its CI
# has run: the step the apps' autofix runs, here in a workflow of its own,
# as this repo has no autofix (dependabot-merge/action.yml says why the
# ruleset on main is the gate). Those bumps touch only this
# repo's dev tools, which the apps never run, and merge only once every
# required check is green. Action bumps change what the apps run, so they
# stay merged by hand.
name: Dependabot Auto-Merge

on:
  # When CI finishes, not on the PR: a workflow_run run belongs to main, so
  # PRs don't list it. A pull_request or pull_request_target job skipped by
  # its `if:` shows as a skipped check on every PR.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    # Only the runs of a Dependabot npm PR's CI; the action checks the PR
    # itself, and turns auto-merge on once per PR, never again after that.
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: jbhirsh/ci/dependabot-merge@main
