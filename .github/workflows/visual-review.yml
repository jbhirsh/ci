# Visual review (ci#64): each PR's screenshots against main's of the commit
# it's built on, as a before/after table in the PR's description and the
# `Visual changes` status. It runs from the default branch's copy of the
# caller, on events GitHub starts there, so a PR can't change it, and it
# never checks out or runs a PR's code: it reads the shots as bytes from
# the runs' artifacts (visual-shots uploads them). An app calls it from a
# visual-review.yml of its own:
#
#   on:
#     workflow_run:
#       workflows: [E2E, PR GIFs]   # its screenshot workflow, and its GIF bot's
#       types: [completed]
#     pull_request_target:
#       types: [edited, auto_merge_enabled, auto_merge_disabled]
#   permissions: {}
#   jobs:
#     review:
#       permissions:
#         actions: read
#         contents: write     # enable.mjs turns Dependabot's auto-merge on
#         statuses: write
#         pull-requests: write
#         issues: write
#       uses: jbhirsh/ci/.github/workflows/visual-review.yml@main
#       secrets:
#         bot-pr-token: ${{ secrets.BOT_PR_TOKEN }}
#
# Its settings are the app's `visual-review` key in .github/ci.json
# (visual-review/settings.mjs). Three jobs:
#   - find (visual-review/find): which reviews the event calls for, from the
#     event and the API alone (find.mjs's header), each with its PR's or
#     mockup issue's number;
#   - review (visual-review), one per PR or mockup, in a concurrency group of
#     its own so a PR's status writes take turns: compares, sets the status,
#     and hands the table to attach as an artifact;
#   - attach (visual-review/attach), one per target, in the group PR GIFs'
#     attach job shares (pr-gif-attach-<repo>-<number>), so the two take
#     turns on a description: uploads the pictures in one edit of the
#     description with BOT_PR_TOKEN, then writes the finished table into its
#     block and slots with the Actions token, which starts no workflow. No
#     comment is posted (ci#144).
# Nothing waits on a clock: each event that could change a result runs it
# again, and every run works the result out afresh.

name: Visual review

on:
  workflow_call:
    secrets:
      bot-pr-token:
        description: BOT_PR_TOKEN, the only kind of token GitHub lets attach files.
        required: true

permissions: {}

jobs:
  find:
    # A workflow_run of anything but a PR, a push or a run by hand (a
    # schedule's) calls for nothing.
    if: >-
      github.event_name != 'workflow_run' ||
      contains(fromJSON('["pull_request", "push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    # A mockup's shots are downloaded for their manifest.
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      targets: ${{ steps.find.outputs.targets }}
      any: ${{ steps.find.outputs.any }}
    steps:
      # The default branch, for the settings, never the PR: named outright,
      # since pull_request_target's default ref is the PR's base branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: find
        uses: jbhirsh/ci/visual-review/find@main

  review:
    needs: find
    if: needs.find.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      statuses: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.find.outputs.targets) }}
    concurrency:
      group: visual-review-${{ github.repository }}-${{ matrix.target.kind == 'pr' && format('pr-{0}', matrix.target.number) || format('run-{0}', matrix.target.run) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jbhirsh/ci/visual-review@main
        with:
          target: ${{ toJSON(matrix.target) }}
          upload-token: ${{ secrets.bot-pr-token }}

  attach:
    needs: [find, review]
    # After every review leg, a failed one too: its target simply handed
    # nothing off. GitHub keeps one waiting job a group: a third queued
    # while one runs and one waits cancels the waiting one. A visual-review
    # attach lost that way is written at the PR's next review; a GIF attach
    # fails the PR GIFs status, and its re-run writes it. A group of its own
    # would instead let either edit overwrite the other's block.
    if: always() && needs.find.result == 'success' && needs.find.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.find.outputs.targets) }}
    concurrency:
      group: pr-gif-attach-${{ github.repository }}-${{ matrix.target.number }}
      cancel-in-progress: false
    steps:
      - uses: jbhirsh/ci/visual-review/attach@main
        with:
          run: ${{ matrix.target.run }}
          kind: ${{ matrix.target.kind }}
          number: ${{ matrix.target.number }}
          upload-token: ${{ secrets.bot-pr-token }}
