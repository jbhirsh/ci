# One-off: posts colour-test/comment.md on ci#97, so its images aren't
# stripped by the tool that writes issues. Never merged; the branch is deleted.
name: Colour test
on:
  push:
    branches: [mobile-colour-test]
permissions:
  issues: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: gh issue comment 97 --repo "$GITHUB_REPOSITORY" --body-file colour-test/comment.md
        env:
          GH_TOKEN: ${{ github.token }}
