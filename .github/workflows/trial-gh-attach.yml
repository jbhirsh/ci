# Throwaway trial for jbhirsh/ci#33 (T1): what `gh --attach` does from
# Actions, and which token may attach. Runs only on its own draft PR, which
# is closed unmerged and its branch deleted once the results are read.
name: Trial gh attach
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  trial:
    if: github.head_ref == 'trial-gh-attach'
    runs-on: ubuntu-latest
    steps:
      - name: Install the latest gh
        run: |
          set -eu
          tag=$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name)
          curl -fsSL -o gh.tgz "https://github.com/cli/cli/releases/download/${tag}/gh_${tag#v}_linux_amd64.tar.gz"
          tar xzf gh.tgz
          echo "$PWD/gh_${tag#v}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Make a tiny test GIF
        run: |
          printf 'R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==' | base64 -d > trial-pixel.gif
          gh --version
      - name: Attach with the Actions token
        id: actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Trial with GITHUB_TOKEN\n\n![trial](./trial-pixel.gif)\n' > body.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file body.md --attach ./trial-pixel.gif 2>&1 | tee actions.log
      - name: Attach with BOT_PR_TOKEN
        id: bot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "BOT_PR_TOKEN is not set in this repo"; exit 0; fi
          printf 'Trial with BOT_PR_TOKEN\n\n![trial](./trial-pixel.gif)\n' > body.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file body.md --attach ./trial-pixel.gif 2>&1 | tee bot.log
      - name: Rewrite the PR description in place
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Trial PR for jbhirsh/ci#33. Description edit with a local reference:\n\n![trial](./trial-pixel.gif)\n' > desc.md
          gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file desc.md --attach ./trial-pixel.gif 2>&1 | tee edit.log
      - name: Report what came back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=${{ github.event.pull_request.number }}
          echo "== PR body =="; gh pr view "$n" --repo ${{ github.repository }} --json body -q .body
          echo "== comments =="; gh api "repos/${{ github.repository }}/issues/$n/comments" -q '.[].body'
          echo "== link checks =="
          { gh pr view "$n" --repo ${{ github.repository }} --json body -q .body; gh api "repos/${{ github.repository }}/issues/$n/comments" -q '.[].body'; } \
            | grep -oE 'https://github\.com/user-attachments/assets/[A-Za-z0-9-]+' | sort -u | while read -r u; do
              echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{content_type}' -L "$u")"
            done
