# One-off check V10 for jbhirsh/ci#144, second push: fetch the attachments the
# first run (45747339808) put in ci#145, signed out, now that they've had time
# to go live, and compare each with the runner's PNG hash. Never merged.
name: V10 throwaway

on:
  push:
    branches: [v10-issue-attach-throwaway]

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch signed out
        run: |
          echo "want red  802769b7ac77d81a0106d702e2ad6a5983eb8d2ca64848cb6bc1d0b248e93055"
          echo "want blue 1e6b28b86bdf8faca9bd3dda09ecf2d46e69a15bba9729b8d53cf15a42064afb"
          for u in 29444f13-d872-4f4b-92d1-e0afb37b2ce2 c0143921-223b-4c16-88ba-e74bff959a27; do
            out=$(curl -sS -L -o got.bin -w '%{http_code} %{content_type} %{url_effective}' "https://github.com/user-attachments/assets/$u")
            echo "$u: $out" | sed -E 's/\?.*//'
            sha256sum got.bin
          done
