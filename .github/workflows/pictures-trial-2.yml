# One-off trial of ci#133 (never on main; deleted after).
name: Pictures trial second

run-name: Pictures from pictures/trial-2

on:
  push:
    branches: [tmp/pictures-trial]
    paths: [.github/workflows/pictures-trial-2.yml]

permissions: {}

concurrency:
  group: pr-gif-attach-${{ github.repository }}-134
  cancel-in-progress: false

jobs:
  files:
    name: Files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: jbhirsh/ci/pictures/from-branch@tmp/pictures-trial
        with:
          branch: "pictures/trial-2"
          files: "after-402.png | Second run"
          target: "134"
          host-pr: 134
          block: "trial-2"
          columns: "1"
          width: "300"

  attach:
    name: Attach
    needs: files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - uses: jbhirsh/ci/pictures/attach@tmp/pictures-trial
        with:
          target: "134"
          host-pr: 134
          run-id: ${{ github.run_id }}
          artifact: pictures
          files: "after-402.png | Second run"
          block: "trial-2"
          columns: "1"
          width: "300"
          token: ${{ secrets.BOT_PR_TOKEN }}
