name: Secret scan (gitleaks)
description: >-
  Checks out the app's full history and scans it with gitleaks: on a pull
  request, the PR's commit range (fast, targeted, blocks the merge); on a
  schedule or a manual run, every commit, as a drift sensor for a secret that
  slipped in outside the PR path (a direct push, rewritten history, a new
  gitleaks rule catching an old leak). gitleaks reads the app's own
  .gitleaks.toml (its allowlist) when there is one: allowlist a false
  positive there rather than disabling the job. Findings go to the job
  summary and a results artifact; PR comments are off, so the job needs only
  contents read. No GITLEAKS_LICENSE: the action is free for personal-account
  repositories.

inputs:
  github-token:
    description: >-
      Read-only token. gitleaks-action uses it to resolve the PR's commit
      range and for its license check; the scan itself runs on the checkout.
    default: ${{ github.token }}
  version:
    description: >-
      The gitleaks release to scan with: the newest by default, so its newest
      rules read every push. Without it the action falls back to a version
      it carries, which falls behind. A rule that finds something new in an
      app's history fails that app's weekly sweep: a real finding to fix or
      allowlist, not a reason to hold gitleaks back.
    default: latest

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        # Full history: PR runs diff the PR's commit range; scheduled runs
        # sweep every commit.
        fetch-depth: 0
        persist-credentials: false

    - uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITLEAKS_ENABLE_COMMENTS: "false"
        GITLEAKS_VERSION: ${{ inputs.version }}
