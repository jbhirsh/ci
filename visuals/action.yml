name: PR visuals
description: >-
  Fails a pull request that changes the UI when its description shows none
  of it (check.mjs's header says what counts, and the app's `visuals`
  settings in .github/ci.json say which files are UI); with `sharedTemplate`
  on it passes every PR on that rule, visual review deciding instead, and
  instead holds the PR's description to the shared shape
  (pr-template/check-body.mjs says what passes). Run it from a workflow
  triggered on pull_request types opened, edited, synchronize, reopened and
  ready_for_review: it re-runs on description edits, so adding the pictures
  turns it green without a new push. The job needs contents and
  pull-requests read. No path filter on the trigger: the check passes a PR
  with no UI files on its own, so it can be a required check.

inputs:
  github-token:
    description: >-
      A token that can read the pull request's files (pull-requests read);
      the Actions token does.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: .github

    - uses: actions/setup-node@v7
      with:
        node-version: 24

    # The files API pages through large PRs, where `gh pr diff` gives up.
    - name: List the PR's changed files
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
          --jq '.[].filename' > "$RUNNER_TEMP/pr-visuals-files.txt"

    - name: Check the description shows UI changes
      shell: bash
      env:
        # Passed through the environment, never interpolated into the script.
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_FILES: ${{ runner.temp }}/pr-visuals-files.txt
      run: node "$GITHUB_ACTION_PATH/check.mjs" < "$PR_FILES"

    # Only with the app's `visuals.sharedTemplate`: the description's shape
    # (headings, the goal's issue, the plan table's shading, each change's commit,
    # Revisions naming the head), apart from the UI check above, which
    # visual review's status also reads.
    - name: Check the description is in the shared shape
      shell: bash
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_STATE: ${{ github.event.pull_request.state }}
        PR_DRAFT: ${{ github.event.pull_request.draft }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: node "$GITHUB_ACTION_PATH/../pr-template/check-body.mjs"
