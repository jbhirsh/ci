name: Visual shots, apply a mockup
description: >-
  Applies a mockup's throwaway patch to the checkout before the app is
  built, for a run by hand on main (ci#64): the patch comes base64 in the
  dispatch's mockup_patch input, and only paths the app's
  `visual-review.mockupPaths` allows may change, never a lockfile, with no
  rename, link or mode change (visual-shots/shots.ts). The job must hold
  no secret and write no cache while the patch is applied: the patch is
  code on no branch. Pass the inputs straight from the dispatch, never
  spliced into a script.

  The limit of that: a patched file that ends up running on the runner,
  outside a browser page, runs with the job. That's a Playwright spec, a
  test helper, anything a spec or config imports from `src/`, or the app
  itself in sift's Simulator. Such code can reach the job's later steps,
  and through them the job's runtime token, which uploads artifacts and
  writes caches. A mockup runs on main, so anything it caches is restored
  by every later run on every branch and PR, main's reference runs
  included. A writer's branch can't do that: it writes only its own cache.
  The owner accepted this so mockups can show new screens (ci#64): only
  someone with write access can dispatch one, and they can already run
  code in this repository's workflows. So keep `mockupPaths` to the files
  a screen needs (name the spec files or their folder, not `**` or all
  of `e2e/`), never the test config, global setup, `package.json` or CI
  files (only lockfiles are refused by the tool), and check out with
  `persist-credentials: false` on a mockup.

inputs:
  patch:
    description: The dispatch's mockup_patch input.
    required: true
  issue:
    description: The dispatch's mockup_issue input.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        # Nothing here installs packages, so there's no cache to restore; and
        # an app's `packageManager` field would otherwise turn setup-node's
        # automatic caching on, writing one from a run that holds code no one
        # reviewed (a PR's, or a mockup's patch).
        package-manager-cache: false

    - name: Apply the mockup patch
      shell: bash
      env:
        MOCKUP_PATCH: ${{ inputs.patch }}
        MOCKUP_ISSUE: ${{ inputs.issue }}
        # Only a dispatch on the default branch is read by visual-review.
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: node "$GITHUB_ACTION_PATH/../shots.ts" mockup
